<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-DOC // PDF & CANVAS SYSTEM</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

    :root {
      --bg-dark: #000000;
      --bg-panel: #0a0002;
      --bg-hover: #1f0206;
      --border-red: #ff0033;
      --border-dark-red: #88001b;
      --text-red: #ff2a55;
      --text-bright: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: #050505;
      color: var(--text-bright);
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #000;
      border-bottom: 4px solid var(--border-red);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--text-red);
      text-shadow: 2px 2px #550011;
    }

    .brand svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 4px var(--border-red));
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: #110004;
      border: 2px solid var(--border-red);
      color: var(--text-bright);
      padding: 8px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 2px 2px 0px #88001b;
    }

    .btn:hover {
      background: var(--border-red);
      color: #000;
      box-shadow: 2px 2px 0px #ffffff;
    }

    .btn.active {
      background: var(--border-red);
      color: #000;
      border-color: #ffffff;
      box-shadow: inset 2px 2px 0px #000;
    }

    .size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #110004;
      border: 2px solid var(--border-dark-red);
      padding: 4px 8px;
      font-size: 12px;
    }

    .size-control input[type="range"] {
      accent-color: var(--border-red);
      cursor: pointer;
      width: 80px;
    }

    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 280px;
      background: #030001;
      border-right: 4px solid var(--border-red);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow-y: auto;
    }

    .section-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-red);
      border-bottom: 2px dashed var(--border-dark-red);
      padding-bottom: 6px;
      margin-top: 8px;
    }

    .folder-item {
      background: #0e0004;
      border: 2px solid var(--border-dark-red);
      padding: 8px;
      margin-top: 6px;
      cursor: pointer;
    }

    .folder-item.active {
      border-color: var(--border-red);
      background: #1a0008;
    }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      color: #ff99aa;
    }

    .pdf-list {
      margin-top: 6px;
      padding-left: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pdf-item {
      padding: 6px;
      background: #050001;
      border: 1px solid var(--border-dark-red);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      word-break: break-all;
    }

    .pdf-item:hover, .pdf-item.active {
      background: var(--border-red);
      color: #000;
    }

    .workspace {
      flex: 1;
      position: relative;
      background: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    #canvas-container {
      position: relative;
      background: #ffffff;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
      margin: auto;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    #pdf-canvas { z-index: 1; }
    #draw-canvas { z-index: 2; cursor: crosshair; }

    .status-bar {
      background: #000;
      border-top: 2px solid var(--border-dark-red);
      padding: 4px 12px;
      font-size: 11px;
      color: var(--text-red);
      display: flex;
      justify-content: space-between;
    }

    #pdf-input { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100">
        <path d="M5,50 Q50,10 95,50 Q50,90 5,50 Z" fill="#ffffff" stroke="#000" stroke-width="4"/>
        <circle cx="50" cy="50" r="22" fill="#000"/>
        <polygon points="50,32 58,40 42,40" fill="#ffffff"/>
        <circle cx="50" cy="50" r="5" fill="#ff0033"/>
      </svg>
      CYBER-DOC v3.0
    </div>

    <div class="toolbar">
      <button class="btn" onclick="document.getElementById('pdf-input').click()">+ LOAD PDF</button>
      <input type="file" id="pdf-input" accept="application/pdf">

      <button id="btn-pen" class="btn active" onclick="setTool('pen')">PEN</button>
      <div class="size-control">
        <span>P-SIZE:</span>
        <input type="range" id="pen-size" min="1" max="50" value="3" oninput="updatePenSize(this.value)">
        <span id="pen-size-val">3px</span>
      </div>

      <button id="btn-eraser" class="btn" onclick="setTool('eraser')">ERASER</button>
      <div class="size-control">
        <span>E-SIZE:</span>
        <input type="range" id="eraser-size" min="5" max="100" value="20" oninput="updateEraserSize(this.value)">
        <span id="eraser-size-val">20px</span>
      </div>

      <button class="btn" onclick="clearCanvas()">CLEAR</button>
      <button class="btn" onclick="downloadPage()">EXPORT</button>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      <button class="btn" style="width: 100%;" onclick="createNewFolder()">+ NEW FOLDER</button>
      <div class="section-title">// ORGANIZER</div>
      <div id="folder-tree"></div>
    </div>

    <div class="workspace">
      <div id="canvas-container">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-text">SYSTEM READY // NO PDF LOADED</span>
    <span id="page-info">PAGE: 0 / 0</span>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentTool = 'pen';
    let penSize = 3;
    let eraserSize = 20;
    let isDrawing = false;
    let lastPoint = null;

    let folders = [{ id: 'default', name: 'ROOT_DOCS', pdfs: [] }];
    let currentFolderId = 'default';

    const pdfCanvas = document.getElementById('pdf-canvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');

    function setTool(tool) {
      currentTool = tool;
      document.getElementById('btn-pen').classList.toggle('active', tool === 'pen');
      document.getElementById('btn-eraser').classList.toggle('active', tool === 'eraser');
    }

    function updatePenSize(val) {
      penSize = parseInt(val, 10);
      document.getElementById('pen-size-val').innerText = val + 'px';
    }

    function updateEraserSize(val) {
      eraserSize = parseInt(val, 10);
      document.getElementById('eraser-size-val').innerText = val + 'px';
    }

    function initCanvasSize(w, h) {
      const container = document.getElementById('canvas-container');
      container.style.width = w + 'px';
      container.style.height = h + 'px';
      pdfCanvas.width = w;
      pdfCanvas.height = h;
      drawCanvas.width = w;
      drawCanvas.height = h;
    }

    initCanvasSize(800, 1000);
    drawCtx.fillStyle = '#ffffff';
    drawCtx.fillRect(0,0,800,1000);

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      lastPoint = getPos(e);
      drawPoint(lastPoint);
    }

    function drawPoint(p) {
      drawCtx.beginPath();
      if (currentTool === 'pen') {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.fillStyle = '#000000';
        drawCtx.arc(p.x, p.y, penSize / 2, 0, Math.PI * 2);
        drawCtx.fill();
      } else {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.arc(p.x, p.y, eraserSize / 2, 0, Math.PI * 2);
        drawCtx.fill();
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const currentPoint = getPos(e);

      if (lastPoint) {
        drawCtx.beginPath();
        drawCtx.moveTo(lastPoint.x, lastPoint.y);
        drawCtx.lineTo(currentPoint.x, currentPoint.y);

        if (currentTool === 'pen') {
          drawCtx.globalCompositeOperation = 'source-over';
          drawCtx.strokeStyle = '#000000';
          drawCtx.lineWidth = penSize;
          drawCtx.lineCap = 'round';
          drawCtx.lineJoin = 'round';
        } else {
          drawCtx.globalCompositeOperation = 'destination-out';
          drawCtx.strokeStyle = 'rgba(0,0,0,1)';
          drawCtx.lineWidth = eraserSize;
          drawCtx.lineCap = 'round';
          drawCtx.lineJoin = 'round';
        }
        drawCtx.stroke();
      }
      lastPoint = currentPoint;
    }

    function stopDrawing() {
      isDrawing = false;
      lastPoint = null;
    }

    drawCanvas.addEventListener('pointerdown', startDrawing);
    drawCanvas.addEventListener('pointermove', draw);
    drawCanvas.addEventListener('pointerup', stopDrawing);
    drawCanvas.addEventListener('pointercancel', stopDrawing);

    function clearCanvas() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    function createNewFolder() {
      const name = prompt("ENTER FOLDER NAME:");
      if (name) {
        folders.push({ id: 'folder_' + Date.now(), name: name.toUpperCase(), pdfs: [] });
        renderFolders();
      }
    }

    function renderFolders() {
      const tree = document.getElementById('folder-tree');
      tree.innerHTML = '';

      folders.forEach(f => {
        const fEl = document.createElement('div');
        fEl.className = 'folder-item' + (f.id === currentFolderId ? ' active' : '');
        fEl.onclick = () => { currentFolderId = f.id; renderFolders(); };
        fEl.innerHTML = `
          <div class="folder-header">
            <span>📁 ${f.name}</span>
            <span>(${f.pdfs.length})</span>
          </div>
          <div class="pdf-list">
            ${f.pdfs.map((pdf, idx) => `
              <div class="pdf-item" onclick="event.stopPropagation(); loadPdfFromMemory('${f.id}',${idx})">
                📄 ${pdf.name}
              </div>
            `).join('')}
          </div>
        `;
        tree.appendChild(fEl);
      });
    }

    document.getElementById('pdf-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const typedarray = new Uint8Array(evt.target.result);
        const folder = folders.find(f => f.id === currentFolderId) || folders[0];
        folder.pdfs.push({ name: file.name, data: typedarray });
        renderFolders();
        renderPdfData(typedarray, file.name);
      };
      reader.readAsArrayBuffer(file);
    });

    function loadPdfFromMemory(folderId, pdfIdx) {
      const folder = folders.find(f => f.id === folderId);
      if (folder && folder.pdfs[pdfIdx]) {
        renderPdfData(folder.pdfs[pdfIdx].data, folder.pdfs[pdfIdx].name);
      }
    }

    function renderPdfData(typedarray, name) {
      document.getElementById('status-text').innerText = "LOADING: " + name;
      pdfjsLib.getDocument(typedarray).promise.then(pdf => {
        document.getElementById('page-info').innerText = `PAGE: 1 / ${pdf.numPages}`;
        pdf.getPage(1).then(page => {
          const viewport = page.getViewport({ scale: 1.5 });
          initCanvasSize(viewport.width, viewport.height);
          page.render({ canvasContext: pdfCtx, viewport: viewport });
          document.getElementById('status-text').innerText = "READY // " + name;
        });
      });
    }

    function downloadPage() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = drawCanvas.width;
      tempCanvas.height = drawCanvas.height;
      const ctx = tempCanvas.getContext('2d');
      ctx.drawImage(pdfCanvas, 0, 0);
      ctx.drawImage(drawCanvas, 0, 0);
      const a = document.createElement('a');
      a.download = 'annotated-doc.png';
      a.href = tempCanvas.toDataURL('image/png');
      a.click();
    }

    renderFolders();
  </script>
</body>
</html>
