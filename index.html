<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CENTIPEDE. // PDF & CANVAS SYSTEM</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

    :root {
      --logo-red: #ff0033;
      --accent: #e8e8ec;
      --accent-dim: #3a3a42;
      --border: #2c2c33;
      --panel: #141417;
      --panel-alt: #1c1c21;
      --text-bright: #ffffff;
      --text-dim: #9a9aa2;
      --disabled-grey: #444449;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      background-color: #050505;
      color: var(--text-bright);
      font-family: 'Share Tech Mono', monospace;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background: #000;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--logo-red);
    }

    .brand svg {
      width: 26px;
      height: 26px;
    }

    main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .view {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .view.active { display: flex; }

    /* ---------- MAIN MENU VIEW ---------- */
    #view-menu { padding: 20px; overflow-y: auto; }

    .menu-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--text-bright);
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .menu-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .folder-tree { display: flex; flex-direction: column; gap: 10px; max-width: 700px; }

    .folder-item {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px;
      cursor: pointer;
    }

    .folder-item.active { border-color: var(--accent); background: var(--panel-alt); }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      color: var(--text-bright);
      font-size: 13px;
    }

    .pdf-list {
      margin-top: 8px;
      padding-left: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pdf-item {
      padding: 12px 10px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      word-break: break-all;
      color: var(--text-dim);
    }

    .pdf-item:active, .pdf-item:hover { background: var(--accent); color: #000; }

    .empty-hint { color: var(--text-dim); font-size: 11px; padding: 8px 0; }

    /* ---------- BUTTONS ---------- */
    .btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 6px 10px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      border-radius: 3px;
    }

    .btn:hover { background: var(--accent-dim); }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .btn:disabled {
      background: var(--panel);
      border-color: var(--disabled-grey);
      color: var(--disabled-grey);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* ---------- VIEWER ---------- */
    #view-viewer { flex-direction: column; }

    .viewer-toolbar {
      background: #000;
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .size-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 3px 8px;
      font-size: 10px;
      flex-shrink: 0;
      border-radius: 3px;
      color: var(--text-dim);
    }

    .size-control input[type="range"] { accent-color: var(--accent); cursor: pointer; width: 70px; }
    .size-control:has(input:disabled) { opacity: 0.5; }

    .workspace {
      flex: 1;
      position: relative;
      background: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    #canvas-container {
      position: relative;
      background: #ffffff;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.5);
      margin: auto;
    }

    canvas { position: absolute; top: 0; left: 0; touch-action: none; }
    #pdf-canvas { z-index: 1; }
    #draw-canvas { z-index: 2; cursor: crosshair; }

    /* Page-skip arrows: floating on the canvas itself, not buried in a status bar */
    .page-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(20, 20, 23, 0.85);
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(2px);
    }
    .page-arrow:active { background: var(--accent); color: #000; }
    .page-arrow.left { left: 12px; }
    .page-arrow.right { right: 12px; }
    .page-arrow:disabled { opacity: 0.25; cursor: default; }

    .page-pill {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 3px;
      z-index: 10;
      white-space: nowrap;
    }

    .status-bar {
      background: #000;
      border-top: 1px solid var(--border);
      padding: 5px 12px;
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100">
        <path d="M5,50 Q50,10 95,50 Q50,90 5,50 Z" fill="#ffffff" stroke="#000" stroke-width="4"/>
        <circle cx="50" cy="50" r="22" fill="#000"/>
        <polygon points="50,32 58,40 42,40" fill="#ffffff"/>
        <circle cx="50" cy="50" r="5" fill="#ff0033"/>
      </svg>
      CENTIPEDE.
    </div>
  </header>

  <main>
    <!-- MAIN MENU -->
    <section id="view-menu" class="view active">
      <div class="menu-title">// MAIN MENU</div>
      <div class="menu-actions">
        <button class="btn" onclick="document.getElementById('pdf-input').click()">+ LOAD PDF</button>
        <button class="btn" onclick="createNewFolder()">+ NEW FOLDER</button>
      </div>
      <input type="file" id="pdf-input" accept="application/pdf" hidden>
      <div id="folder-tree" class="folder-tree"></div>
    </section>

    <!-- VIEWER -->
    <section id="view-viewer" class="view">
      <div class="viewer-toolbar">
        <button class="btn" onclick="showMenu()">☰ MENU</button>

        <button id="btn-pen" class="btn active">PEN</button>
        <div class="size-control">
          <span>SIZE:</span>
          <input type="range" id="pen-size" min="1" max="50" value="3" oninput="updatePenSize(this.value)">
          <span id="pen-size-val">3px</span>
        </div>

        <button id="btn-highlighter" class="btn" disabled title="Disabled — pen only">HIGHLIGHT</button>
        <button id="btn-eraser" class="btn" disabled title="Disabled — pen only">ERASER</button>

        <button class="btn" onclick="clearCanvas()">CLEAR</button>
        <button class="btn" onclick="downloadPage()">EXPORT</button>
      </div>

      <div class="workspace">
        <button class="page-arrow left" id="btn-prev-page" onclick="prevPage()">◀</button>
        <div id="canvas-container">
          <canvas id="pdf-canvas"></canvas>
          <canvas id="draw-canvas"></canvas>
        </div>
        <button class="page-arrow right" id="btn-next-page" onclick="nextPage()">▶</button>
        <div class="page-pill" id="page-info">PAGE: 0 / 0</div>
      </div>
    </section>
  </main>

  <div class="status-bar"><span id="status-text">SYSTEM READY // NO PDF LOADED</span></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Only the pen writes. Highlighter/eraser are disabled per request; the
    // tool is hard-locked to 'pen' so no other drawing mode can be reached.
    const currentTool = 'pen';
    let penSize = 3;
    let isDrawing = false;
    let lastPoint = null;
    let activePointerId = null; // only this pointer is allowed to draw

    let folders = [{ id: 'default', name: 'ROOT_DOCS', pdfs: [] }];
    let currentFolderId = 'default';

    let pdfDoc = null;
    let currentPageNum = 1;
    let totalPages = 0;
    let currentPdfName = '';
    let pageAnnotations = {};

    const pdfCanvas = document.getElementById('pdf-canvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');

    // ---- View switching ----
    function showMenu() {
      document.getElementById('view-viewer').classList.remove('active');
      document.getElementById('view-menu').classList.add('active');
      renderFolders();
    }
    function showViewer() {
      document.getElementById('view-menu').classList.remove('active');
      document.getElementById('view-viewer').classList.add('active');
    }

    function updatePenSize(val) {
      penSize = parseInt(val, 10);
      document.getElementById('pen-size-val').innerText = val + 'px';
    }

    function initCanvasSize(w, h) {
      const container = document.getElementById('canvas-container');
      container.style.width = w + 'px';
      container.style.height = h + 'px';
      pdfCanvas.width = w;
      pdfCanvas.height = h;
      drawCanvas.width = w;
      drawCanvas.height = h;
    }

    initCanvasSize(800, 1000);
    drawCtx.fillStyle = '#ffffff';
    drawCtx.fillRect(0, 0, 800, 1000);

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    // Palm/multi-touch rejection: only the browser's "primary" touch point
    // (normally the first finger down) is ever allowed to draw, and we lock
    // to its pointerId until it lifts, so a second finger can't get
    // connected into the same stroke.
    function shouldAcceptPointer(e) {
      if (e.pointerType === 'touch' && !e.isPrimary) return false;
      return true;
    }

    function applyStrokeStyle() {
      drawCtx.globalAlpha = 1;
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.strokeStyle = '#000000';
      drawCtx.fillStyle = '#000000';
      drawCtx.lineWidth = penSize;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
    }

    function drawPoint(p) {
      applyStrokeStyle();
      drawCtx.beginPath();
      drawCtx.arc(p.x, p.y, penSize / 2, 0, Math.PI * 2);
      drawCtx.fill();
    }

    function startDrawing(e) {
      if (!shouldAcceptPointer(e)) return;
      if (activePointerId !== null && activePointerId !== e.pointerId) return;
      e.preventDefault();
      activePointerId = e.pointerId;
      isDrawing = true;
      lastPoint = getPos(e);
      drawPoint(lastPoint);
    }

    function draw(e) {
      if (!isDrawing) return;
      if (e.pointerId !== activePointerId) return;
      e.preventDefault();
      const currentPoint = getPos(e);
      if (lastPoint) {
        applyStrokeStyle();
        drawCtx.beginPath();
        drawCtx.moveTo(lastPoint.x, lastPoint.y);
        drawCtx.lineTo(currentPoint.x, currentPoint.y);
        drawCtx.stroke();
      }
      lastPoint = currentPoint;
    }

    function stopDrawing(e) {
      if (e && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
      isDrawing = false;
      lastPoint = null;
      activePointerId = null;
    }

    drawCanvas.addEventListener('pointerdown', startDrawing);
    drawCanvas.addEventListener('pointermove', draw);
    drawCanvas.addEventListener('pointerup', stopDrawing);
    drawCanvas.addEventListener('pointercancel', stopDrawing);
    drawCanvas.addEventListener('pointerleave', stopDrawing);

    function clearCanvas() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    // ---- Folders / PDFs ----
    function createNewFolder() {
      const name = prompt("ENTER FOLDER NAME:");
      if (name) {
        folders.push({ id: 'folder_' + Date.now(), name: name.toUpperCase(), pdfs: [] });
        renderFolders();
      }
    }

    function renderFolders() {
      const tree = document.getElementById('folder-tree');
      tree.innerHTML = '';

      folders.forEach(f => {
        const fEl = document.createElement('div');
        fEl.className = 'folder-item' + (f.id === currentFolderId ? ' active' : '');
        fEl.onclick = () => { currentFolderId = f.id; renderFolders(); };
        fEl.innerHTML = `
          <div class="folder-header">
            <span>📁 ${f.name}</span>
            <span>(${f.pdfs.length})</span>
          </div>
          <div class="pdf-list">
            ${f.pdfs.length ? f.pdfs.map((pdf, idx) => `
              <div class="pdf-item" onclick="event.stopPropagation(); openPdfFromMemory('${f.id}',${idx})">
                📄 ${pdf.name}
              </div>
            `).join('') : '<div class="empty-hint">No PDFs yet — tap + LOAD PDF above.</div>'}
          </div>
        `;
        tree.appendChild(fEl);
      });
    }

    document.getElementById('pdf-input').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        const typedarray = new Uint8Array(evt.target.result);
        const folder = folders.find(f => f.id === currentFolderId) || folders[0];
        folder.pdfs.push({ name: file.name, data: typedarray });
        openPdf(typedarray, file.name);
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    });

    // Tapping a PDF in the menu opens it straight into the viewer.
    function openPdfFromMemory(folderId, pdfIdx) {
      const folder = folders.find(f => f.id === folderId);
      if (folder && folder.pdfs[pdfIdx]) {
        openPdf(folder.pdfs[pdfIdx].data, folder.pdfs[pdfIdx].name);
      }
    }

    function openPdf(typedarray, name) {
      showViewer();
      document.getElementById('status-text').innerText = "LOADING: " + name;
      pdfjsLib.getDocument(typedarray).promise.then(pdf => {
        pdfDoc = pdf;
        totalPages = pdf.numPages;
        currentPdfName = name;
        currentPageNum = 1;
        pageAnnotations = {};
        renderPage(1);
      }).catch(err => {
        document.getElementById('status-text').innerText = "ERROR LOADING PDF";
        console.error(err);
      });
    }

    function renderPage(num) {
      if (!pdfDoc || num < 1 || num > totalPages) return;
      saveCurrentPageAnnotation();

      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.5 });
        initCanvasSize(viewport.width, viewport.height);
        page.render({ canvasContext: pdfCtx, viewport: viewport }).promise.then(() => {
          currentPageNum = num;
          drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          const saved = pageAnnotations[num];
          if (saved) {
            const img = new Image();
            img.onload = () => drawCtx.drawImage(img, 0, 0);
            img.src = saved;
          }
          updatePageControls();
          document.getElementById('status-text').innerText = "READY // " + currentPdfName;
        });
      });
    }

    function saveCurrentPageAnnotation() {
      if (!pdfDoc) return;
      pageAnnotations[currentPageNum] = drawCanvas.toDataURL();
    }

    function nextPage() { if (pdfDoc && currentPageNum < totalPages) renderPage(currentPageNum + 1); }
    function prevPage() { if (pdfDoc && currentPageNum > 1) renderPage(currentPageNum - 1); }

    function updatePageControls() {
      document.getElementById('page-info').innerText = `PAGE: ${currentPageNum} / ${totalPages}`;
      document.getElementById('btn-prev-page').disabled = currentPageNum <= 1;
      document.getElementById('btn-next-page').disabled = currentPageNum >= totalPages;
    }

    // ---- Export ----
    // iOS/iPadOS Safari ignores the anchor "download" attribute — clicking a
    // download link just navigates to the data URL instead of saving a file,
    // which is why export previously appeared to do nothing on iPad. The fix
    // is the Web Share API: when available (iOS 15+, all iPad browsers use
    // WebKit) it opens the native share sheet with "Save Image" / "Save to
    // Files" built in. Desktop browsers without file-sharing support fall
    // back to a normal blob download, which works reliably there.
    function downloadPage() {
      try {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = drawCanvas.width;
        tempCanvas.height = drawCanvas.height;
        const ctx = tempCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        ctx.drawImage(pdfCanvas, 0, 0);
        ctx.drawImage(drawCanvas, 0, 0);

        tempCanvas.toBlob(async (blob) => {
          if (!blob) {
            document.getElementById('status-text').innerText = "EXPORT FAILED";
            alert('Export failed: could not generate image.');
            return;
          }

          const fileName = 'annotated-doc-page' + currentPageNum + '.png';
          const file = new File([blob], fileName, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: fileName });
              document.getElementById('status-text').innerText = "EXPORTED // " + fileName;
            } catch (shareErr) {
              // User cancelled the share sheet, or share failed silently — no alert needed.
              console.log('Share cancelled/failed:', shareErr);
            }
            return;
          }

          // Fallback for browsers without Web Share file support.
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
          document.getElementById('status-text').innerText = "EXPORTED // " + fileName;
        }, 'image/png');
      } catch (err) {
        console.error('Export failed:', err);
        document.getElementById('status-text').innerText = "EXPORT FAILED";
        alert('Export failed: ' + err.message);
      }
    }

    renderFolders();
    updatePageControls();
  </script>
</body>
</html>
