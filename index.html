<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CENTIPEDE.</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

    :root {
      --logo-red: #ff0033;
      --accent: #e8e8ec;
      --accent-dim: #3a3a42;
      --border: #2c2c33;
      --panel: #141417;
      --panel-alt: #1c1c21;
      --text-bright: #ffffff;
      --text-dim: #9a9aa2;
      --disabled-grey: #444449;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none; 
    }

    html, body {
      background-color: #050505;
      color: var(--text-bright);
      font-family: 'Share Tech Mono', monospace;
      height: 100%;
      overflow: hidden;
      touch-action: none !important;
      overscroll-behavior: none;
    }

    body { display: flex; flex-direction: column; }

    header, .viewer-toolbar {
      background: rgba(10, 10, 12, 0.75); 
      backdrop-filter: blur(16px);        
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
      padding: 10px 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 50; 
    }

    header { justify-content: center; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--logo-red);
    }

    .brand svg { width: 26px; height: 26px; }

    main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: scale(0.98) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    .view {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .view.active { 
      display: flex; 
      animation: viewFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }

    #view-menu { padding: 20px; overflow-y: auto; }

    .menu-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--text-bright);
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .menu-actions { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    
    .folder-tree { display: flex; flex-direction: column; gap: 6px; max-width: 700px; }
    
    .folder-item { 
      background: transparent; 
      border: 1px solid transparent; 
      padding: 12px 14px; 
      cursor: pointer; 
      border-radius: 6px;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    .folder-item:hover { background: var(--panel); transform: translateX(4px); }
    .folder-item.active { border-left: 3px solid var(--logo-red); background: var(--panel-alt); transform: translateX(4px); }

    .folder-header { display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 13px; }

    .pdf-list { margin-top: 10px; padding-left: 8px; display: flex; flex-direction: column; gap: 8px; }
    
    .pdf-item {
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.2s ease;
    }
    .pdf-item:hover { background: var(--text-bright); color: #000; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1); }
    .empty-hint { color: var(--text-dim); font-size: 11px; padding: 8px 0; opacity: 0.7; }

    .btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 8px 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 6px; 
      touch-action: manipulation;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover { background: var(--accent-dim); transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }
    .btn.active { background: var(--text-bright); color: #000; border-color: var(--text-bright); font-weight: bold; }
    .btn:disabled { background: var(--panel); border-color: var(--disabled-grey); color: var(--disabled-grey); cursor: not-allowed; opacity: 0.6; }

    #view-viewer { flex-direction: column; }
    .viewer-toolbar { gap: 6px; }

    .tool-wrapper { position: relative; display: inline-block; }
    
    .tool-popover {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 12px;
      background: rgba(20, 20, 23, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 14px;
      min-width: 220px;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      flex-direction: column;
      gap: 16px;
    }
    
    .tool-popover.active { display: flex; animation: viewFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .popover-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    
    .color-presets { display: flex; gap: 8px; }
    .color-swatch { 
      width: 24px; height: 24px; 
      border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.1); 
      cursor: pointer; 
      transition: transform 0.1s;
    }
    .color-swatch:hover { transform: scale(1.15); border-color: #fff; }
    
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 50%; }
    
    .size-preview-container {
      width: 44px; 
      height: 44px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      background: #2a2a30; 
      border-radius: 6px; 
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }
    .size-preview-dot { 
      border-radius: 50%; 
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15); 
      transition: width 0.05s ease, height 0.05s ease;
    }

    input[type=range] { -webkit-appearance: none; background: transparent; flex: 1; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #2c2c33; border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--text-bright); cursor: pointer; -webkit-appearance: none; margin-top: -6px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: transform 0.1s; }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }

    .workspace {
      flex: 1;
      position: relative;
      background: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none !important;
    }

    #canvas-container {
      position: relative;
      background: #ffffff;
      margin: auto;
      transform-origin: center center; 
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      touch-action: none !important;
    }

    canvas, .textLayer { 
      position: absolute; 
      top: 0; 
      left: 0; 
      touch-action: none !important;
    }
    #pdf-canvas { z-index: 1; }
    .textLayer { z-index: 2; opacity: 0.5; } 
    
    #highlight-canvas {
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    #draw-canvas { 
      z-index: 4; 
      cursor: crosshair; 
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas-container.mode-draw #draw-canvas { pointer-events: auto; }
    #canvas-container.mode-select #draw-canvas { pointer-events: none; }
    #canvas-container.mode-select .textLayer { pointer-events: auto; user-select: none; -webkit-user-select: none; }
    #canvas-container.mode-select .textLayer span { user-select: text; -webkit-user-select: text; cursor: text; }

    .page-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(20, 20, 23, 0.85);
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(2px);
    }
    .page-arrow:active { background: var(--accent); color: #000; }
    .page-arrow.left { left: 12px; }
    .page-arrow.right { right: 12px; }
    .page-arrow:disabled { opacity: 0.25; cursor: default; }

    .page-pill {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 4px;
      z-index: 10;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      font-family: inherit;
    }
    .page-pill:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .page-pill:active { transform: translateX(-50%) scale(0.95); }

    .status-bar {
      background: #000;
      border-top: 1px solid var(--border);
      padding: 5px 12px;
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100">
        <path d="M5,50 Q50,10 95,50 Q50,90 5,50 Z" fill="#ffffff" stroke="#000" stroke-width="4"/>
        <circle cx="50" cy="50" r="22" fill="#000"/>
        <polygon points="50,32 58,40 42,40" fill="#ffffff"/>
        <circle cx="50" cy="50" r="5" fill="#ff0033"/>
      </svg>
      CENTIPEDE.
    </div>
  </header>

  <main>
    <section id="view-menu" class="view active">
      <div class="menu-title">// MAIN MENU</div>
      <div class="menu-actions">
        <button class="btn" onclick="document.getElementById('pdf-input').click()">+ LOAD PDF</button>
        <button class="btn" onclick="createNewFolder()">+ NEW FOLDER</button>
      </div>
      <input type="file" id="pdf-input" accept="application/pdf" hidden>
      <div id="folder-tree" class="folder-tree"></div>
    </section>

    <section id="view-viewer" class="view">
      <div class="viewer-toolbar">
        <button class="btn" onclick="showMenu()">☰ MENU</button>
        
        <div class="tool-wrapper">
          <button id="btn-pen" class="btn active" onclick="handleToolClick('pen')">PEN</button>
          <div id="popover-pen" class="tool-popover">
            <div class="popover-row">
              <div class="color-presets">
                <div class="color-swatch" style="background:#000000;" onclick="updateToolSettings('pen', 'color', '#000000')"></div>
                <div class="color-swatch" style="background:#ffffff;" onclick="updateToolSettings('pen', 'color', '#ffffff')"></div>
                <div class="color-swatch" style="background:#ff0033;" onclick="updateToolSettings('pen', 'color', '#ff0033')"></div>
                <div class="color-swatch" style="background:#2962ff;" onclick="updateToolSettings('pen', 'color', '#2962ff')"></div>
                <div class="color-swatch" style="background:#00c853;" onclick="updateToolSettings('pen', 'color', '#00c853')"></div>
              </div>
              <input type="color" id="pen-color-picker" value="#000000" onchange="updateToolSettings('pen', 'color', this.value)">
            </div>
            <div class="popover-row">
              <input type="range" min="1" max="25" value="3" oninput="updateToolSettings('pen', 'size', this.value)">
              <div class="size-preview-container"><div id="pen-preview-dot" class="size-preview-dot"></div></div>
            </div>
          </div>
        </div>

        <div class="tool-wrapper">
          <button id="btn-highlighter" class="btn" onclick="handleToolClick('highlighter')">HIGHLIGHT</button>
          <div id="popover-highlighter" class="tool-popover">
            <div class="popover-row">
              <div class="color-presets">
                <div class="color-swatch" style="background:#ffeb3b;" onclick="updateToolSettings('highlighter', 'color', '#ffeb3b')"></div>
                <div class="color-swatch" style="background:#00e676;" onclick="updateToolSettings('highlighter', 'color', '#00e676')"></div>
                <div class="color-swatch" style="background:#00e5ff;" onclick="updateToolSettings('highlighter', 'color', '#00e5ff')"></div>
                <div class="color-swatch" style="background:#f50057;" onclick="updateToolSettings('highlighter', 'color', '#f50057')"></div>
              </div>
              <input type="color" id="hl-color-picker" value="#ffeb3b" onchange="updateToolSettings('highlighter', 'color', this.value)">
            </div>
            <div class="popover-row">
              <input type="range" min="4" max="60" value="12" oninput="updateToolSettings('highlighter', 'size', this.value)">
              <div class="size-preview-container"><div id="hl-preview-dot" class="size-preview-dot"></div></div>
            </div>
            <div class="popover-row" style="margin-top: 4px;">
              <button id="hl-snap-toggle" class="btn" style="width: 100%; justify-content: center;" onclick="toggleHlSnap()">LINE SNAP: OFF</button>
            </div>
          </div>
        </div>

        <div class="tool-wrapper">
          <button id="btn-eraser" class="btn" onclick="handleToolClick('eraser')">ERASE</button>
          <div id="popover-eraser" class="tool-popover">
            <div class="popover-row">
              <input type="range" min="4" max="80" value="20" oninput="updateToolSettings('eraser', 'size', this.value)">
              <div class="size-preview-container"><div id="eraser-preview-dot" class="size-preview-dot"></div></div>
            </div>
          </div>
        </div>
        
        <button id="btn-touch-toggle" class="btn" onclick="toggleFingerDrawing()">FINGER: OFF</button>
        <button class="btn" onclick="clearCurrentPage()">CLEAR PAGE</button>
        <button class="btn" onclick="exportFullPdf()">EXPORT</button>

        <div style="margin-left: auto; display: flex; gap: 6px;">
          <button class="btn" onclick="undoCanvas()">↩ UNDO</button>
          <button class="btn" onclick="redoCanvas()">REDO ↪</button>
          <button id="btn-mode-toggle" class="btn active" onclick="toggleInteractionMode()">MODE: DRAW</button>
        </div>
      </div>

      <div class="workspace">
        <button class="page-arrow left" id="btn-prev-page" onclick="prevPage()">◀</button>
        
        <div id="canvas-container" class="mode-draw">
          <canvas id="pdf-canvas"></canvas>
          <div id="text-layer" class="textLayer"></div>
          <canvas id="highlight-canvas"></canvas>
          <canvas id="draw-canvas"></canvas>
        </div>
        
        <button class="page-arrow right" id="btn-next-page" onclick="nextPage()">▶</button>
        <button class="page-pill" id="page-info" onclick="resetView()">PAGE: 0 / 0</button>
      </div>
    </section>
  </main>

  <div class="status-bar"><span id="status-text">SYSTEM READY // NO PDF LOADED</span></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // Suppress WebKit default gestures globally
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(name => {
      document.addEventListener(name, (e) => e.preventDefault(), { passive: false });
    });

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentTool = 'pen'; 
    let isDrawing = false;
    let isPageDirty = false;
    let activePenId = null;
    let strokePoints = []; 
    let allowFingerDrawing = false; 
    let interactionMode = 'draw'; 

    let toolSettings = {
      pen: { size: 3, color: '#000000' },
      highlighter: { size: 12, color: '#ffeb3b' },
      eraser: { size: 20 }
    };
    
    let activePopover = null;
    
    let isHlSnap = false;
    const strokeSnapshotCanvasDraw = document.createElement('canvas');
    const strokeSnapshotCanvasHl = document.createElement('canvas');

    // Viewport & Scale Management
    let baseWidth = 0;
    let baseHeight = 0;
    let fitScale = 1.0;
    let currentScale = 1;
    let currentPanX = 0;
    let currentPanY = 0;
    let isPinching = false;
    let initDist = 0;
    let initScale = 1;
    let initPan = { x: 0, y: 0 };
    let initCenter = { x: 0, y: 0 };
    let zoomDebounceTimer = null;
    let currentRenderTask = null;

    // Background Page Pre-fetch Cache
    const pdfPageCache = new Map();

    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 20;

    let folders = []; 
    let currentFolderId = null;
    let pdfDoc = null;
    let currentPageNum = 1;
    let totalPages = 0;
    let currentPdfName = '';
    let currentPdfId = null;
    let pageAnnotations = {};

    const pdfCanvas = document.getElementById('pdf-canvas');
    const pdfCtx = pdfCanvas.getContext('2d', { alpha: false });
    const highlightCanvas = document.getElementById('highlight-canvas');
    const highlightCtx = highlightCanvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const textLayerDiv = document.getElementById('text-layer');

    const DB_NAME = 'centipede-db';
    const DB_VERSION = 1;
    let dbPromise = null;

    function getDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('pdfMeta')) {
            const s = db.createObjectStore('pdfMeta', { keyPath: 'id' });
            s.createIndex('folderId', 'folderId');
          }
          if (!db.objectStoreNames.contains('pdfData')) db.createObjectStore('pdfData', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('annotations')) db.createObjectStore('annotations', { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    function idbPut(storeName, value) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(value);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }

    function idbGet(storeName, key) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const req = db.transaction(storeName, 'readonly').objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    }

    function idbGetAll(storeName) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    }

    function idbDelete(storeName, key) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }

    function purgeAnnotationsForPdf(pdfId) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('annotations', 'readwrite');
        const store = tx.objectStore('annotations');
        const req = store.openCursor(IDBKeyRange.bound(pdfId + '_', pdfId + '_\uffff'));
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            cursor.delete();
            cursor.continue();
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }

    async function initApp() {
      document.getElementById('status-text').innerText = "LOADING LIBRARY...";
      updatePreviews();
      
      let dbFolders = await idbGetAll('folders');
      if (!dbFolders.length) {
        const def = { id: 'default', name: 'ROOT_DOCS' };
        await idbPut('folders', def);
        dbFolders = [def];
      }
      const dbPdfMeta = await idbGetAll('pdfMeta');
      folders = dbFolders.map(f => ({
        ...f,
        pdfs: dbPdfMeta.filter(p => p.folderId === f.id).map(p => ({ id: p.id, name: p.name }))
      }));
      currentFolderId = folders[0].id;
      renderFolders();
      document.getElementById('status-text').innerText = "SYSTEM READY // LIBRARY LOADED";
    }

    function showMenu() {
      closePopovers();
      saveCurrentPageAnnotation();
      document.getElementById('view-viewer').classList.remove('active');
      document.getElementById('view-menu').classList.add('active');
      renderFolders();
    }
    
    function showViewer() {
      document.getElementById('view-menu').classList.remove('active');
      document.getElementById('view-viewer').classList.add('active');
    }

    function toggleInteractionMode() {
      closePopovers();
      const container = document.getElementById('canvas-container');
      const btn = document.getElementById('btn-mode-toggle');
      
      if (interactionMode === 'draw') {
        interactionMode = 'select';
        btn.innerText = 'MODE: SELECT';
        btn.classList.remove('active');
        container.classList.remove('mode-draw');
        container.classList.add('mode-select');
      } else {
        interactionMode = 'draw';
        btn.innerText = 'MODE: DRAW';
        btn.classList.add('active');
        container.classList.remove('mode-select');
        container.classList.add('mode-draw');
      }
    }

    function handleToolClick(toolName) {
      if (currentTool === toolName) {
        const popover = document.getElementById('popover-' + toolName);
        if (activePopover === popover) {
          closePopovers();
        } else {
          closePopovers();
          popover.classList.add('active');
          activePopover = popover;
        }
      } else {
        setTool(toolName);
        closePopovers();
      }
    }

    function setTool(toolName) {
      currentTool = toolName;
      document.getElementById('btn-pen').classList.toggle('active', toolName === 'pen');
      document.getElementById('btn-highlighter').classList.toggle('active', toolName === 'highlighter');
      document.getElementById('btn-eraser').classList.toggle('active', toolName === 'eraser');
      
      if (interactionMode === 'select') {
         toggleInteractionMode();
      }
    }

    function closePopovers() {
      if (activePopover) {
        activePopover.classList.remove('active');
        activePopover = null;
      }
    }

    function updateToolSettings(tool, prop, value) {
      toolSettings[tool][prop] = (prop === 'size') ? parseInt(value, 10) : value;
      
      if (prop === 'color') {
        if (tool === 'pen') document.getElementById('pen-color-picker').value = value;
        if (tool === 'highlighter') document.getElementById('hl-color-picker').value = value;
      }
      updatePreviews();
    }

    function updatePreviews() {
      const penDot = document.getElementById('pen-preview-dot');
      const visualPenSize = Math.min(toolSettings.pen.size, 38);
      penDot.style.width = visualPenSize + 'px';
      penDot.style.height = visualPenSize + 'px';
      penDot.style.backgroundColor = toolSettings.pen.color;

      const hlDot = document.getElementById('hl-preview-dot');
      const visualHlSize = Math.min(toolSettings.highlighter.size, 38);
      hlDot.style.width = visualHlSize + 'px';
      hlDot.style.height = visualHlSize + 'px';
      hlDot.style.backgroundColor = toolSettings.highlighter.color;
      hlDot.style.opacity = '0.75'; 

      const erDot = document.getElementById('eraser-preview-dot');
      const visualEraserSize = Math.min(Math.round(toolSettings.eraser.size * (38 / 80) + 4), 38);
      erDot.style.width = visualEraserSize + 'px';
      erDot.style.height = visualEraserSize + 'px';
      erDot.style.backgroundColor = '#ffffff'; 
      erDot.style.border = '1px solid rgba(0, 0, 0, 0.4)';
    }

    function toggleFingerDrawing() {
      allowFingerDrawing = !allowFingerDrawing;
      const btn = document.getElementById('btn-touch-toggle');
      if (allowFingerDrawing) {
        btn.innerText = 'FINGER: ON';
        btn.classList.add('active');
      } else {
        btn.innerText = 'FINGER: OFF';
        btn.classList.remove('active');
      }
    }

    function toggleHlSnap() {
      isHlSnap = !isHlSnap;
      const btn = document.getElementById('hl-snap-toggle');
      if (isHlSnap) {
        btn.innerText = 'LINE SNAP: ON';
        btn.classList.add('active');
      } else {
        btn.innerText = 'LINE SNAP: OFF';
        btn.classList.remove('active');
      }
    }

    // --- PINCH-TO-ZOOM MATRIX ---
    function applyTransform() {
      const container = document.getElementById('canvas-container');
      container.style.transform = `translate3d(${currentPanX}px, ${currentPanY}px, 0) scale(${currentScale})`;
    }

    function resetView() {
      currentScale = 1;
      currentPanX = 0;
      currentPanY = 0;
      applyTransform();
      reRenderPdfSharp();
    }

    const workspaceEl = document.querySelector('.workspace');

    // capture: true forces workspace to seize 2-finger zooms before TextLayer selects text
    workspaceEl.addEventListener('touchstart', (e) => {
      const touches = Array.from(e.touches);
      if (touches.some(t => t.touchType === 'stylus')) {
        isPinching = false;
        return;
      }

      if (touches.length >= 2 && !isDrawing) {
        e.preventDefault();
        isPinching = true;

        const t1 = touches[0];
        const t2 = touches[1];

        initDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        initCenter = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };
        initScale = currentScale;
        initPan = { x: currentPanX, y: currentPanY };
      }
    }, { passive: false, capture: true });

    workspaceEl.addEventListener('touchmove', (e) => {
      if (isPinching && e.touches.length >= 2) {
        e.preventDefault();

        const touches = Array.from(e.touches);
        if (touches.some(t => t.touchType === 'stylus')) {
          isPinching = false;
          return;
        }

        const t1 = touches[0];
        const t2 = touches[1];

        const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        const currentCenter = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };

        if (initDist === 0) return;

        const scaleDiff = currentDist / initDist;
        const newScale = Math.max(0.7, Math.min(initScale * scaleDiff, 5.0)); 

        const dx = currentCenter.x - initCenter.x;
        const dy = currentCenter.y - initCenter.y;

        currentScale = newScale;
        currentPanX = initPan.x + dx;
        currentPanY = initPan.y + dy;

        applyTransform();
      }
    }, { passive: false, capture: true });

    function handleTouchEnd(e) {
      if (e.touches.length < 2) {
        if (isPinching) {
          isPinching = false;
          clearTimeout(zoomDebounceTimer);
          zoomDebounceTimer = setTimeout(reRenderPdfSharp, 150);
        }
      }
    }

    workspaceEl.addEventListener('touchend', handleTouchEnd, { passive: false, capture: true });
    workspaceEl.addEventListener('touchcancel', handleTouchEnd, { passive: false, capture: true });

    // DYNAMIC VECTOR RE-RASTERIZATION ENGINE (Background rendering prevents flashes)
    async function reRenderPdfSharp() {
      if (!pdfDoc || !baseWidth || !baseHeight) return;
      const dpr = window.devicePixelRatio || 1;
      const zoomFactor = Math.min(Math.max(currentScale, 1.0), 3.0);
      
      const targetW = Math.round(baseWidth * dpr * zoomFactor);
      const targetH = Math.round(baseHeight * dpr * zoomFactor);
      
      if (targetW * targetH > 15000000) return;

      const page = await pdfDoc.getPage(currentPageNum);
      const viewport = page.getViewport({ scale: fitScale * dpr * zoomFactor });

      if (currentRenderTask) {
        try { currentRenderTask.cancel(); } catch (err) {}
      }

      // Draw onto an offscreen canvas to prevent the screen from going blank while loading
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = targetW;
      tempCanvas.height = targetH;
      const tempCtx = tempCanvas.getContext('2d', { alpha: false });
      tempCtx.drawImage(pdfCanvas, 0, 0, targetW, targetH);

      currentRenderTask = page.render({
        canvasContext: tempCtx,
        viewport: viewport
      });

      try {
        await currentRenderTask.promise;
        pdfCanvas.width = targetW;
        pdfCanvas.height = targetH;
        pdfCanvas.style.width = baseWidth + 'px';
        pdfCanvas.style.height = baseHeight + 'px';
        pdfCtx.drawImage(tempCanvas, 0, 0);

        // Update instant-flip cache
        if (currentScale === 1 && !pdfPageCache.has(currentPageNum)) {
           const cacheCanvas = document.createElement('canvas');
           cacheCanvas.width = targetW;
           cacheCanvas.height = targetH;
           cacheCanvas.getContext('2d', {alpha:false}).drawImage(tempCanvas, 0, 0);
           pdfPageCache.set(currentPageNum, cacheCanvas);
        }
      } catch (err) {}
    }

    // Background Page Pre-fetcher
    async function preRenderPage(num) {
      if (!pdfDoc || num > totalPages || num < 1 || pdfPageCache.has(num)) return;
      try {
        const page = await pdfDoc.getPage(num);
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const availW = Math.max(workspaceEl.clientWidth - 32, 320);
        const availH = Math.max(workspaceEl.clientHeight - 32, 320);
        const tempFitScale = Math.min(availW / unscaledViewport.width, availH / unscaledViewport.height);
        
        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: tempFitScale * dpr });
        
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d', { alpha: false });
        
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        pdfPageCache.set(num, canvas);
        
        if (pdfPageCache.size > 6) {
          pdfPageCache.delete(pdfPageCache.keys().next().value);
        }
      } catch (e) {}
    }

    function initCanvasDimensions(w, h) {
      const container = document.getElementById('canvas-container');
      const dpr = window.devicePixelRatio || 1;

      container.style.width = w + 'px';
      container.style.height = h + 'px';
      textLayerDiv.style.width = w + 'px';
      textLayerDiv.style.height = h + 'px';

      [drawCanvas, highlightCanvas].forEach(c => {
        c.width = w * dpr;
        c.height = h * dpr;
        c.style.width = w + 'px';
        c.style.height = h + 'px';
      });

      if (pdfCanvas.width !== Math.round(w * dpr) || pdfCanvas.height !== Math.round(h * dpr)) {
         pdfCanvas.width = w * dpr;
         pdfCanvas.height = h * dpr;
         pdfCanvas.style.width = w + 'px';
         pdfCanvas.style.height = h + 'px';
      }

      drawCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawCtx.scale(dpr, dpr);
      highlightCtx.setTransform(1, 0, 0, 1, 0, 0);
      highlightCtx.scale(dpr, dpr);
    }

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return { 
        x: (e.clientX - rect.left) * (baseWidth / rect.width), 
        y: (e.clientY - rect.top) * (baseHeight / rect.height) 
      };
    }

    function pushStateToHistory() {
      if (undoStack.length >= MAX_HISTORY) undoStack.shift();
      undoStack.push({
        draw: drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height),
        hl: highlightCtx.getImageData(0, 0, highlightCanvas.width, highlightCanvas.height)
      });
      redoStack = []; 
    }

    function undoCanvas() {
      closePopovers();
      if (undoStack.length === 0) return;
      redoStack.push({
        draw: drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height),
        hl: highlightCtx.getImageData(0, 0, highlightCanvas.width, highlightCanvas.height)
      });
      const state = undoStack.pop();
      drawCtx.putImageData(state.draw, 0, 0);
      highlightCtx.putImageData(state.hl, 0, 0);
      isPageDirty = true;
    }

    function redoCanvas() {
      closePopovers();
      if (redoStack.length === 0) return;
      undoStack.push({
        draw: drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height),
        hl: highlightCtx.getImageData(0, 0, highlightCanvas.width, highlightCanvas.height)
      });
      const state = redoStack.pop();
      drawCtx.putImageData(state.draw, 0, 0);
      highlightCtx.putImageData(state.hl, 0, 0);
      isPageDirty = true;
    }

    function clearCurrentPage() {
      closePopovers();
      pushStateToHistory(); 
      const dpr = window.devicePixelRatio || 1;
      drawCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
      highlightCtx.clearRect(0, 0, highlightCanvas.width / dpr, highlightCanvas.height / dpr);
      isPageDirty = true;
      document.getElementById('status-text').innerText = `CLEARED // PAGE ${currentPageNum}`;
    }

    function getActiveCtx() {
      return (currentTool === 'highlighter') ? highlightCtx : drawCtx;
    }

    function applyStrokeStyle() {
      if (currentTool === 'eraser') {
        drawCtx.globalAlpha = 1;
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.strokeStyle = '#000'; 
        drawCtx.fillStyle = '#000';
        drawCtx.lineWidth = toolSettings.eraser.size;

        highlightCtx.globalAlpha = 1;
        highlightCtx.globalCompositeOperation = 'destination-out';
        highlightCtx.strokeStyle = '#000'; 
        highlightCtx.fillStyle = '#000';
        highlightCtx.lineWidth = toolSettings.eraser.size;
      } else if (currentTool === 'highlighter') {
        highlightCtx.globalAlpha = 1; 
        highlightCtx.globalCompositeOperation = 'source-over';
        highlightCtx.strokeStyle = toolSettings.highlighter.color; 
        highlightCtx.fillStyle = toolSettings.highlighter.color;
        highlightCtx.lineWidth = toolSettings.highlighter.size;
      } else {
        drawCtx.globalAlpha = 1;
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = toolSettings.pen.color;
        drawCtx.fillStyle = toolSettings.pen.color;
        drawCtx.lineWidth = toolSettings.pen.size;
      }
      
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      highlightCtx.lineCap = 'round';
      highlightCtx.lineJoin = 'round';
    }

    function drawPoint(p) {
      applyStrokeStyle();
      
      if (currentTool === 'eraser') {
        const radius = toolSettings.eraser.size / 2;
        [drawCtx, highlightCtx].forEach(ctx => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });
        return;
      }

      const ctx = getActiveCtx();
      const radius = (currentTool === 'highlighter') 
        ? toolSettings.highlighter.size / 2 
        : toolSettings.pen.size / 2;

      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function shouldAcceptPointer(e) {
      if (interactionMode !== 'draw') return false; 
      if (e.pointerType === 'pen') return true; 
      if (allowFingerDrawing && e.pointerType === 'touch' && e.isPrimary && !isPinching) {
        return true;
      }
      return false;
    }

    function startDrawing(e) {
      if (!shouldAcceptPointer(e)) return;
      closePopovers();

      if (e.pointerType === 'pen') {
        isPinching = false;
      }

      activePenId = e.pointerId;
      isDrawing = true;
      isPageDirty = true;
      
      pushStateToHistory(); 

      strokeSnapshotCanvasDraw.width = drawCanvas.width;
      strokeSnapshotCanvasDraw.height = drawCanvas.height;
      strokeSnapshotCanvasDraw.getContext('2d').drawImage(drawCanvas, 0, 0);

      strokeSnapshotCanvasHl.width = highlightCanvas.width;
      strokeSnapshotCanvasHl.height = highlightCanvas.height;
      strokeSnapshotCanvasHl.getContext('2d').drawImage(highlightCanvas, 0, 0);

      const startPt = getPos(e);
      strokePoints = [startPt]; 
      
      try { drawCanvas.setPointerCapture(activePenId); } catch (err) {}
      drawPoint(startPt);
    }

    function draw(e) {
      if (!isDrawing || e.pointerId !== activePenId) return;
      
      const events = (typeof e.getCoalescedEvents === 'function') 
        ? e.getCoalescedEvents() 
        : [e];

      if (currentTool === 'highlighter' && isHlSnap) {
        let pt = getPos(events[events.length - 1]);
        
        const dx = pt.x - strokePoints[0].x;
        const dy = pt.y - strokePoints[0].y;
        const angle = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
        
        if (angle < 15 || angle > 165) {
          pt.y = strokePoints[0].y; 
        } else if (Math.abs(angle - 90) < 15) {
          pt.x = strokePoints[0].x; 
        }

        const dpr = window.devicePixelRatio || 1;
        
        drawCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
        drawCtx.drawImage(strokeSnapshotCanvasDraw, 0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);

        highlightCtx.clearRect(0, 0, highlightCanvas.width / dpr, highlightCanvas.height / dpr);
        highlightCtx.drawImage(strokeSnapshotCanvasHl, 0, 0, highlightCanvas.width / dpr, highlightCanvas.height / dpr);

        applyStrokeStyle();
        const ctx = getActiveCtx();

        ctx.beginPath();
        ctx.moveTo(strokePoints[0].x, strokePoints[0].y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(strokePoints[0].x, strokePoints[0].y, toolSettings.highlighter.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, toolSettings.highlighter.size / 2, 0, Math.PI * 2);
        ctx.fill();
        
        return; 
      }

      for (let i = 0; i < events.length; i++) {
        const pt = getPos(events[i]);
        strokePoints.push(pt);
        applyStrokeStyle();
        
        const targets = (currentTool === 'eraser') ? [drawCtx, highlightCtx] : [getActiveCtx()];
        
        if (strokePoints.length >= 3) {
          const p0 = strokePoints[strokePoints.length - 3];
          const p1 = strokePoints[strokePoints.length - 2];
          const p2 = strokePoints[strokePoints.length - 1];
          
          const mid1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
          const mid2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
          
          targets.forEach(ctx => {
            ctx.beginPath();
            ctx.moveTo(mid1.x, mid1.y);
            ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
            ctx.stroke();
          });
        } else if (strokePoints.length === 2) {
          targets.forEach(ctx => {
            ctx.beginPath();
            ctx.moveTo(strokePoints[0].x, strokePoints[0].y);
            ctx.lineTo(strokePoints[1].x, strokePoints[1].y);
            ctx.stroke();
          });
        }
      }
    }

    function stopDrawing(e) {
      if (e.pointerId !== activePenId) return;
      isDrawing = false;
      activePenId = null;
      strokePoints = [];
    }

    drawCanvas.addEventListener('pointerdown', startDrawing);
    drawCanvas.addEventListener('pointermove', draw);
    drawCanvas.addEventListener('pointerup', stopDrawing);
    drawCanvas.addEventListener('pointercancel', stopDrawing);
    drawCanvas.addEventListener('pointerleave', stopDrawing);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && currentPdfId) {
        saveCurrentPageAnnotation();
      }
    });

    async function createNewFolder() {
      const name = prompt("ENTER FOLDER NAME:");
      if (!name) return;
      const folder = { id: 'folder_' + Date.now(), name: name.toUpperCase() };
      await idbPut('folders', folder);
      folders.push({ ...folder, pdfs: [] });
      renderFolders();
    }

    async function deleteFolder(folderId, evt) {
      evt.stopPropagation();
      const folder = folders.find(f => f.id === folderId);
      if (!folder) return;
      if (!confirm(`Delete folder "${folder.name}" and all ${folder.pdfs.length} PDF(s) inside it? This cannot be undone.`)) return;
      for (const pdf of folder.pdfs) {
        await idbDelete('pdfMeta', pdf.id);
        await idbDelete('pdfData', pdf.id);
        await purgeAnnotationsForPdf(pdf.id);
      }
      await idbDelete('folders', folderId);
      folders = folders.filter(f => f.id !== folderId);
      if (!folders.length) {
        const def = { id: 'default', name: 'ROOT_DOCS' };
        await idbPut('folders', def);
        folders = [{ ...def, pdfs: [] }];
      }
      if (currentFolderId === folderId) currentFolderId = folders[0].id;
      renderFolders();
    }

    async function deletePdf(folderId, pdfId, evt) {
      evt.stopPropagation();
      if (!confirm('Delete this PDF and its markup? This cannot be undone.')) return;
      await idbDelete('pdfMeta', pdfId);
      await idbDelete('pdfData', pdfId);
      await purgeAnnotationsForPdf(pdfId);
      const folder = folders.find(f => f.id === folderId);
      if (folder) folder.pdfs = folder.pdfs.filter(p => p.id !== pdfId);
      renderFolders();
    }

    function renderFolders() {
      const tree = document.getElementById('folder-tree');
      tree.innerHTML = '';

      folders.forEach((f, index) => {
        const fEl = document.createElement('div');
        fEl.className = 'folder-item' + (f.id === currentFolderId ? ' active' : '');
        fEl.style.opacity = '0'; 
        fEl.style.animation = `viewFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.05}s`;
        
        fEl.onclick = () => { currentFolderId = f.id; renderFolders(); };
        fEl.innerHTML = `
          <div class="folder-header">
            <span>📁 ${f.name}</span>
            <span style="display:flex;align-items:center;gap:8px;">
              (${f.pdfs.length})
              <button class="btn" style="padding:4px 8px;font-size:10px;" onclick="deleteFolder('${f.id}', event)">×</button>
            </span>
          </div>
          <div class="pdf-list">
            ${f.pdfs.length ? f.pdfs.map(pdf => `
              <div class="pdf-item" onclick="event.stopPropagation(); openPdfFromMemory('${pdf.id}')">
                <span>📄 ${pdf.name}</span>
                <button class="btn" style="padding:4px 8px;font-size:10px;" onclick="deletePdf('${f.id}','${pdf.id}', event)">×</button>
              </div>
            `).join('') : '<div class="empty-hint">No PDFs yet — tap + LOAD PDF above.</div>'}
          </div>
        `;
        tree.appendChild(fEl);
      });
    }

    document.getElementById('pdf-input').addEventListener('change', async function (e) {
      try {
        document.getElementById('status-text').innerText = "IMPORTING PDF...";
        const file = e.target.files[0];
        if (!file) return;
        
        const arrayBuffer = await file.arrayBuffer();
        const safeData = new Uint8Array(arrayBuffer);
        
        const id = 'pdf_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const meta = { id, folderId: currentFolderId, name: file.name };
        
        await idbPut('pdfMeta', meta);
        await idbPut('pdfData', { id, data: safeData });
        
        const folder = folders.find(f => f.id === currentFolderId) || folders[0];
        folder.pdfs.push({ id, name: file.name });
        
        renderFolders(); 
        openPdf(safeData, file.name, id);
        e.target.value = '';
      } catch (err) {
        console.error(err);
        alert("Error loading file: " + err.message);
        document.getElementById('status-text').innerText = "IMPORT FAILED";
      }
    });

    async function openPdfFromMemory(pdfId) {
      const record = await idbGet('pdfData', pdfId);
      if (!record) { alert('Could not load that PDF from storage.'); return; }
      const meta = await idbGet('pdfMeta', pdfId);
      openPdf(new Uint8Array(record.data), meta ? meta.name : 'Untitled.pdf', pdfId);
    }

    function openPdf(typedarray, name, pdfId) {
      showViewer();
      currentPdfId = pdfId;
      document.getElementById('status-text').innerText = "LOADING: " + name;
      pdfjsLib.getDocument(typedarray).promise.then(pdf => {
        pdfDoc = pdf;
        totalPages = pdf.numPages;
        currentPdfName = name;
        currentPageNum = 1;
        pageAnnotations = {};
        pdfPageCache.clear();
        renderPage(1); 
      }).catch(err => {
        document.getElementById('status-text').innerText = "ERROR LOADING PDF";
        console.error(err);
      });
    }

    function saveCurrentPageAnnotation() {
      if (!pdfDoc || !currentPdfId || !isPageDirty) return;
      const pageToSave = currentPageNum;
      isPageDirty = false;

      const dCopy = document.createElement('canvas');
      dCopy.width = drawCanvas.width;
      dCopy.height = drawCanvas.height;
      dCopy.getContext('2d').drawImage(drawCanvas, 0, 0);

      const hCopy = document.createElement('canvas');
      hCopy.width = highlightCanvas.width;
      hCopy.height = highlightCanvas.height;
      hCopy.getContext('2d').drawImage(highlightCanvas, 0, 0);

      pageAnnotations[pageToSave] = { draw: dCopy, hl: hCopy };

      setTimeout(() => {
        dCopy.toBlob(dBlob => {
          hCopy.toBlob(async hBlob => {
            await idbPut('annotations', { 
              key: currentPdfId + '_' + pageToSave, 
              data: { draw: dBlob, hl: hBlob } 
            });
          }, 'image/png');
        }, 'image/png');
      }, 30);
    }

    // INSTANT DOUBLE-BUFFERED PAGE RENDERER
    async function renderPage(num) {
      if (!pdfDoc || num < 1 || num > totalPages) return;
      
      saveCurrentPageAnnotation();
      undoStack = [];
      redoStack = [];

      currentScale = 1;
      currentPanX = 0;
      currentPanY = 0;
      applyTransform();

      currentPageNum = num;
      updatePageControls();
      document.getElementById('status-text').innerText = "LOADING PAGE...";

      const page = await pdfDoc.getPage(num);
      const unscaledViewport = page.getViewport({ scale: 1.0 });

      const availW = Math.max(workspaceEl.clientWidth - 32, 320);
      const availH = Math.max(workspaceEl.clientHeight - 32, 320);
      fitScale = Math.min(availW / unscaledViewport.width, availH / unscaledViewport.height);

      baseWidth = Math.floor(unscaledViewport.width * fitScale);
      baseHeight = Math.floor(unscaledViewport.height * fitScale);
      
      initCanvasDimensions(baseWidth, baseHeight);

      const dpr = window.devicePixelRatio || 1;
      pdfCtx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);
      drawCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
      highlightCtx.clearRect(0, 0, highlightCanvas.width / dpr, highlightCanvas.height / dpr);
      textLayerDiv.innerHTML = '';

      // 1. Draw cached PDF instantly to screen
      if (pdfPageCache.has(num)) {
          pdfCtx.drawImage(pdfPageCache.get(num), 0, 0, pdfCanvas.width, pdfCanvas.height);
      }

      // 2. Draw Ink instantly to screen
      let saved = pageAnnotations[num];
      if (saved === undefined) {
        const rec = await idbGet('annotations', currentPdfId + '_' + num);
        saved = rec ? rec.data : null;
        pageAnnotations[num] = saved;
      }
      
      if (saved) {
        if (saved.hl) {
          if (saved.hl instanceof HTMLCanvasElement) {
            highlightCtx.drawImage(saved.hl, 0, 0, baseWidth, baseHeight);
          } else if (saved.hl instanceof Blob) {
            const img = new Image();
            const url = URL.createObjectURL(saved.hl);
            img.onload = () => { highlightCtx.drawImage(img, 0, 0, baseWidth, baseHeight); URL.revokeObjectURL(url); };
            img.src = url;
          }
        }
        const drawSrc = saved.draw || (saved instanceof Blob ? saved : null);
        if (drawSrc) {
          if (drawSrc instanceof HTMLCanvasElement) {
            drawCtx.drawImage(drawSrc, 0, 0, baseWidth, baseHeight);
          } else if (drawSrc instanceof Blob) {
            const img = new Image();
            const url = URL.createObjectURL(drawSrc);
            img.onload = () => { drawCtx.drawImage(img, 0, 0, baseWidth, baseHeight); URL.revokeObjectURL(url); };
            img.src = url;
          }
        }
      }

      // 3. Render High-Res PDF in background (Non-blocking)
      reRenderPdfSharp().then(async () => {
        const textContent = await page.getTextContent();
        await pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: page.getViewport({ scale: fitScale }),
          textDivs: []
        }).promise;

        document.getElementById('status-text').innerText = "READY // " + currentPdfName;
        
        preRenderPage(num + 1);
        if (num > 1) preRenderPage(num - 1);
      });
    }

    function nextPage() { if (pdfDoc && currentPageNum < totalPages) renderPage(currentPageNum + 1); }
    function prevPage() { if (pdfDoc && currentPageNum > 1) renderPage(currentPageNum - 1); }

    function updatePageControls() {
      document.getElementById('page-info').innerText = `PAGE: ${currentPageNum} / ${totalPages}`;
      document.getElementById('btn-prev-page').disabled = currentPageNum <= 1;
      document.getElementById('btn-next-page').disabled = currentPageNum >= totalPages;
    }

    async function exportFullPdf() {
      closePopovers();
      try {
        if (!currentPdfId) return;
        document.getElementById('status-text').innerText = "EXPORTING FULL PDF... PLEASE WAIT";
        saveCurrentPageAnnotation();

        const record = await idbGet('pdfData', currentPdfId);
        if (!record || !record.data) throw new Error("Could not load original PDF data.");
        
        const { PDFDocument, BlendMode } = PDFLib;
        const pdf = await PDFDocument.load(record.data);
        const pages = pdf.getPages();
        
        for (let i = 0; i < pages.length; i++) {
          const pageNum = i + 1;
          let annotationData = pageAnnotations[pageNum];
          if (annotationData === undefined) {
             const rec = await idbGet('annotations', currentPdfId + '_' + pageNum);
             if (rec && rec.data) annotationData = rec.data;
          }

          if (annotationData) {
            const page = pages[i];
            const { width, height } = page.getSize();

            let hlBlob = null;
            if (annotationData.hl instanceof HTMLCanvasElement) {
              hlBlob = await new Promise(r => annotationData.hl.toBlob(r, 'image/png'));
            } else if (annotationData.hl instanceof Blob) {
              hlBlob = annotationData.hl;
            }

            if (hlBlob) {
              const hlBytes = await hlBlob.arrayBuffer();
              const hlImage = await pdf.embedPng(hlBytes);
              page.drawImage(hlImage, {
                x: 0, y: 0, width, height,
                blendMode: BlendMode.Multiply
              });
            }

            let drawBlob = null;
            const drawCandidate = annotationData.draw || (annotationData instanceof Blob ? annotationData : null);
            if (drawCandidate instanceof HTMLCanvasElement) {
              drawBlob = await new Promise(r => drawCandidate.toBlob(r, 'image/png'));
            } else if (drawCandidate instanceof Blob) {
              drawBlob = drawCandidate;
            }

            if (drawBlob) {
              const drawBytes = await drawBlob.arrayBuffer();
              const drawImage = await pdf.embedPng(drawBytes);
              page.drawImage(drawImage, {
                x: 0, y: 0, width, height
              });
            }
          }
        }
        
        const pdfBytes = await pdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const fileName = (currentPdfName.replace('.pdf', '') || 'Document') + '_Annotated.pdf';
        const file = new File([blob], fileName, { type: 'application/pdf' });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: fileName });
          document.getElementById('status-text').innerText = "EXPORTED // " + fileName;
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
          document.getElementById('status-text').innerText = "EXPORTED // " + fileName;
        }
      } catch (err) {
        console.error('Export failed:', err);
        document.getElementById('status-text').innerText = "EXPORT FAILED";
        alert('Export failed: ' + err.message);
      }
    }
    
    updatePageControls();
    initApp();
  </script>
</body>
