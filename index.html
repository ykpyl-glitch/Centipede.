<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Centipede.</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#121212">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --bg-main: #121212;
    --card-bg: #1e1e1e;
    --sidebar-bg: #1e1e1e;
    --header-bg: #1e1e1e;
    --accent: #bb86fc;
    --accent-hover: #9965da;
    --border: #2c2c2c;
    --text-primary: #e0e0e0;
    --text-secondary: #a0a0a0;
    --header-height: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; color-scheme: dark; }

  #app { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
  .view { display: none; width: 100%; height: 100%; flex-direction: column; }
  .view.active { display: flex; }

  /* Dashboard View */
  #dashboardView { background: var(--bg-main); }
  .dash-header { height: var(--header-height); background: var(--header-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
  .dash-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
  .dash-title span { color: var(--accent); }

  .btn-primary { background: var(--accent); color: #000000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
  .btn-primary:hover { background: var(--accent-hover); }

  .document-grid { flex: 1; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; overflow-y: auto; align-content: start; }
  .doc-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; position: relative; transition: transform 0.15s, box-shadow 0.15s; }
  .doc-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  .doc-preview { width: 100%; height: 200px; background: #2a2a2a; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .doc-name { font-size: 14px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-meta { font-size: 12px; color: var(--text-secondary); }
  .doc-delete { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* Editor View */
  .editor-header { height: var(--header-height); background: var(--header-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 10; }
  .editor-header-left { display: flex; align-items: center; gap: 12px; }
  .btn-icon { background: transparent; border: none; width: 36px; height: 36px; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }
  .btn-icon:hover { background: #2a2a2a; }
  .doc-title-input { font-size: 16px; font-weight: 600; border: none; outline: none; width: 200px; background: transparent; color: var(--text-primary); }

  .toolbar-container { height: 48px; background: #1a1a1a; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
  .tool-group { display: flex; background: #2a2a2a; padding: 3px; border-radius: 10px; gap: 2px; }
  .tool-btn { background: transparent; border: none; padding: 6px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; color: var(--text-primary); }
  .tool-btn.active { background: #3a3a3a; color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  
  .size-picker { display: flex; align-items: center; gap: 8px; margin-left: 12px; color: var(--text-secondary); }

  #stage { flex: 1; overflow: auto; background: #181818; display: flex; justify-content: center; padding: 20px; }
  #wrap { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.6); background: #ffffff; }
  
  canvas { position: absolute; left: 0; top: 0; }
  #pdf { position: relative; }
  #ink { touch-action: none; z-index: 5; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
<body>

<div id="app">
  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" class="view active">
    <div class="dash-header">
      <div class="dash-title"><span>Centipede.</span></div>
      <div>
        <button class="btn-primary" id="importBtn">➕ Import PDF</button>
        <input id="fileInput" type="file" accept="application/pdf" hidden>
      </div>
    </div>
    <div class="document-grid" id="documentGrid">
      <div class="empty-state">
        <div style="font-size:48px; margin-bottom:12px;">📂</div>
        <p style="font-weight:600;">No Documents Yet</p>
        <p style="font-size:13px;">Import a PDF file to start taking notes and drawing offline.</p>
      </div>
    </div>
  </div>

  <!-- EDITOR VIEW -->
  <div id="editorView" class="view">
    <div class="editor-header">
      <div class="editor-header-left">
        <button class="btn-icon" id="backBtn">◀ Library</button>
        <input type="text" class="doc-title-input" id="activeDocTitle" value="Untitled Document">
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span id="pageInfo" style="font-size:13px; color:var(--text-secondary);">1/1</span>
        <button class="btn-icon" id="prevPage">◀</button>
        <button class="btn-icon" id="nextPage">▶</button>
        <button class="btn-primary" id="saveBtn">💾 Export PDF</button>
      </div>
    </div>

    <div class="toolbar-container">
      <div class="tool-group">
        <button class="tool-btn active" id="penTool" title="Pen">✏️</button>
        <button class="tool-btn" id="highTool" title="Highlighter">🖍️</button>
        <button class="tool-btn" id="eraseTool" title="Eraser">🩹</button>
      </div>
      <div class="size-picker">
        <span style="font-size:12px;">Size:</span>
        <input id="strokeSize" type="range" min="1" max="25" value="3">
      </div>
    </div>

    <div id="stage">
      <div id="wrap">
        <canvas id="pdf"></canvas>
        <canvas id="ink"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const DB_NAME = 'CentipedeDB', DB_VERSION = 1;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('documents')) d.createObjectStore('documents', { keyPath: 'id' });
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

async function saveDocToDB(docRecord) {
  const tx = db.transaction('documents', 'readwrite');
  await tx.objectStore('documents').put(docRecord);
}

async function getAllDocsFromDB() {
  return new Promise((resolve) => {
    const tx = db.transaction('documents', 'readonly');
    const req = tx.objectStore('documents').getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

async function deleteDocFromDB(id) {
  const tx = db.transaction('documents', 'readwrite');
  await tx.objectStore('documents').delete(id);
}

let currentDoc = null, pdfDoc = null, pageNum = 1, tool = 'pen', strokes = {};
let drawing = false, currentStroke = null, activeStylusId = null;
let lastTouchY = 0, lastTouchX = 0, isFingerScrolling = false;

const pdf = document.getElementById('pdf'), ink = document.getElementById('ink');
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
const pctx = pdf.getContext('2d'), ictx = ink.getContext('2d');
const pageInfo = document.getElementById('pageInfo');
const sizeInput = document.getElementById('strokeSize');
const colors = { pen: '#111111', high: '#f4d03f' };

window.addEventListener('DOMContentLoaded', async () => {
  await openDB();
  loadLibrary();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
});

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
}

async function loadLibrary() {
  const docs = await getAllDocsFromDB();
  const grid = document.getElementById('documentGrid');
  if (docs.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div style="font-size:48px; margin-bottom:12px;">📂</div><p style="font-weight:600;">No Documents Yet</p><p style="font-size:13px;">Import a PDF file to start taking notes and drawing offline.</p></div>`;
    return;
  }
  grid.innerHTML = '';
  docs.forEach(doc => {
    const card = document.createElement('div');
    card.className = 'doc-card';
    card.innerHTML = `
      <div class="doc-preview"><span style="font-size:32px;">📄</span></div>
      <div class="doc-info">
        <div class="doc-name">${doc.title}</div>
        <div class="doc-meta">Updated ${new Date(doc.updatedAt).toLocaleDateString()}</div>
      </div>
      <button class="doc-delete" title="Delete">✕</button>
    `;
    card.querySelector('.doc-delete').onclick = (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${doc.title}"?`)) deleteDocFromDB(doc.id).then(loadLibrary);
    };
    card.onclick = () => openDocument(doc);
    grid.appendChild(card);
  });
}

document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const bytes = await file.arrayBuffer();
  const newDoc = {
    id: 'doc_' + Date.now(),
    title: file.name.replace(/\.[^/.]+$/, ""),
    bytes: bytes,
    strokes: {},
    updatedAt: Date.now()
  };
  await saveDocToDB(newDoc);
  await loadLibrary();
  openDocument(newDoc);
};

async function openDocument(docRecord) {
  currentDoc = docRecord;
  strokes = currentDoc.strokes || {};
  pageNum = 1;
  document.getElementById('activeDocTitle').value = currentDoc.title;
  pdfDoc = await pdfjsLib.getDocument({ data: currentDoc.bytes }).promise;
  showView('editorView');
  await renderPage();
}

document.getElementById('backBtn').onclick = async () => {
  if (currentDoc) {
    currentDoc.title = document.getElementById('activeDocTitle').value;
    currentDoc.strokes = strokes;
    currentDoc.updatedAt = Date.now();
    await saveDocToDB(currentDoc);
  }
  showView('dashboardView');
  loadLibrary();
};

document.getElementById('activeDocTitle').onchange = async (e) => {
  if (currentDoc) {
    currentDoc.title = e.target.value;
    await saveDocToDB(currentDoc);
  }
};

async function renderPage() {
  const page = await pdfDoc.getPage(pageNum);
  const vp = page.getViewport({ scale: 1.5 });
  pdf.width = ink.width = vp.width;
  pdf.height = ink.height = vp.height;
  pdf.style.width = ink.style.width = vp.width + 'px';
  pdf.style.height = ink.style.height = vp.height + 'px';
  wrap.style.width = vp.width + 'px';
  wrap.style.height = vp.height + 'px';
  await page.render({ canvasContext: pctx, viewport: vp }).promise;
  redrawStrokes();
  pageInfo.textContent = pageNum + '/' + pdfDoc.numPages;
}

function getStrokes() { return strokes[pageNum] || (strokes[pageNum] = []); }

function redrawStrokes() {
  ictx.clearRect(0, 0, ink.width, ink.height);
  for (const s of getStrokes()) {
    ictx.save();
    ictx.lineCap = 'round';
    ictx.lineJoin = 'round';
    if (s.tool === 'erase') {
      ictx.globalCompositeOperation = 'destination-out';
      ictx.strokeStyle = '#000';
    } else if (s.tool === 'highlighter') {
      ictx.globalAlpha = .35;
      ictx.strokeStyle = colors.high;
      ictx.globalCompositeOperation = 'multiply';
    } else {
      ictx.strokeStyle = colors.pen;
    }
    ictx.lineWidth = s.w;
    ictx.beginPath();
    ictx.moveTo(s.p[0].x, s.p[0].y);
    for (const pt of s.p) ictx.lineTo(pt.x, pt.y);
    ictx.stroke();
    ictx.restore();
  }
}

ink.addEventListener('pointerdown', e => {
  if (e.pointerType === 'pen' || e.pointerType === 'mouse') {
    e.preventDefault();
    e.stopPropagation();
    activeStylusId = e.pointerId;
    drawing = true;
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    
    const rect = ink.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    currentStroke = {
      tool: tool,
      w: tool === 'highlighter' ? sizeInput.value * 3 : +sizeInput.value,
      p: [{ x: x, y: y }]
    };
    getStrokes().push(currentStroke);
  } else if (e.pointerType === 'touch') {
    isFingerScrolling = true;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
}, { passive: false });

ink.addEventListener('pointermove', e => {
  if (drawing && e.pointerId === activeStylusId) {
    e.preventDefault();
    e.stopPropagation();
    const rect = ink.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    currentStroke.p.push({ x: x, y: y });
    redrawStrokes();
  } else if (isFingerScrolling && e.pointerType === 'touch') {
    const deltaX = lastTouchX - e.clientX;
    const deltaY = lastTouchY - e.clientY;
    stage.scrollLeft += deltaX;
    stage.scrollTop += deltaY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
}, { passive: false });

const handlePointerEnd = async e => {
  if (e.pointerId === activeStylusId) {
    if (e.type === 'pointercancel' && currentStroke) {
      const list = getStrokes();
      const idx = list.indexOf(currentStroke);
      if (idx !== -1) list.splice(idx, 1);
      redrawStrokes();
    }
    drawing = false;
    activeStylusId = null;
    try { ink.releasePointerCapture(e.pointerId); } catch (_) {}
    if (currentDoc) {
      currentDoc.strokes = strokes;
      currentDoc.updatedAt = Date.now();
      await saveDocToDB(currentDoc);
    }
  }
  if (e.pointerType === 'touch') {
    isFingerScrolling = false;
  }
};

ink.addEventListener('pointerup', handlePointerEnd);
ink.addEventListener('pointercancel', handlePointerEnd);

function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(t === 'highlighter' ? 'highTool' : (t === 'erase' ? 'eraseTool' : 'penTool')).classList.add('active');
}
document.getElementById('penTool').onclick = () => setTool('pen');
document.getElementById('highTool').onclick = () => setTool('highlighter');
document.getElementById('eraseTool').onclick = () => setTool('erase');

document.getElementById('prevPage').onclick = async () => { if (pdfDoc && pageNum > 1) { pageNum--; await renderPage(); } };
document.getElementById('nextPage').onclick = async () => { if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; await renderPage(); } };

document.getElementById('saveBtn').onclick = async () => {
  if (!pdfDoc || !currentDoc) return;
  const doc = await PDFLib.PDFDocument.load(currentDoc.bytes);
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const arr = strokes[i]; if (!arr || !arr.length) continue;
    const page = doc.getPages()[i - 1]; const s = page.getSize();
    const c = document.createElement('canvas'); c.width = 1000; c.height = 1000 * s.height / s.width;
    const x = c.getContext('2d'); x.scale(c.width / pdf.width, c.height / pdf.height);
    for (const st of arr) {
      x.save(); x.lineCap = 'round'; x.lineJoin = 'round';
      if (st.tool === 'erase') { x.globalCompositeOperation = 'destination-out'; x.strokeStyle = '#000'; }
      else if (st.tool === 'highlighter') { x.globalAlpha = .35; x.strokeStyle = colors.high; x.globalCompositeOperation = 'multiply'; }
      else { x.strokeStyle = colors.pen; }
      x.lineWidth = st.w; x.beginPath(); x.moveTo(st.p[0].x, st.p[0].y); for (const pt of st.p) x.lineTo(pt.x, pt.y); x.stroke(); x.restore();
    }
    const img = await doc.embedPng(await fetch(c.toDataURL()).then(r => r.arrayBuffer()));
    page.drawImage(img, { x: 0, y: 0, width: s.width, height: s.width * (s.height / s.width) });
  }
  const out = await doc.save(); const blob = new Blob([out], { type: 'application/pdf' });
  const u = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = u; a.download = `${currentDoc.title}-Annotated.pdf`; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
};
</script>
</body>
</html>
