<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notes Pro</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6f5e">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
body{margin:0;font-family:-apple-system;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
header,nav{background:#1b1f1d;padding:8px;display:flex;gap:8px;align-items:center}
button{background:#2f6f5e;color:#fff;border:0;border-radius:10px;padding:10px 12px}
button.active{background:#4fb394}#pageInfo{margin-left:auto}
#stage{flex:1;overflow:auto;background:#555;display:flex;justify-content:center}
#wrap{position:relative;margin:16px}canvas{position:absolute;left:0;top:0;touch-action:pan-x pan-y}#pdf{position:relative}
input[type=range]{width:90px}
</style></head><body>
<header>
<button id=openBtn>📂 Open</button>
<button id=saveBtn>💾 Save</button>
<input id=file type=file accept=application/pdf hidden>
<span id=pageInfo>0/0</span>
</header>
<nav>
<button id=pen class=active>✏️</button>
<button id=high>🖍️</button>
<button id=erase>🩹</button>
<input id=size type=range min=1 max=20 value=3>
<button id=prev>◀</button><button id=next>▶</button>
</nav>
<div id=stage><div id=wrap><canvas id=pdf></canvas><canvas id=ink></canvas></div></div>
<script>
let pdfDoc,bytes,pageNum=1,tool='pen',strokes={},drawing=false,current=[],activeStylusId=null;
const pdf=document.getElementById('pdf'),ink=document.getElementById('ink');
const pctx=pdf.getContext('2d'),ictx=ink.getContext('2d');
const wrap=document.getElementById('wrap');
const pageInfo=document.getElementById('pageInfo');
const size=document.getElementById('size');
const colors={pen:'#111',high:'#f4d03f'};
function list(){return strokes[pageNum]||(strokes[pageNum]=[]);}
function setTool(t){tool=t;['pen','high','erase'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(t==='highlighter'?'high':t).classList.add('active');}
pen.onclick=()=>setTool('pen');high.onclick=()=>setTool('highlighter');erase.onclick=()=>setTool('erase');
openBtn.onclick=()=>file.click();
file.onchange=async()=>{const f=file.files[0];if(!f)return;bytes=await f.arrayBuffer();pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise;pageNum=1;strokes={};await render();}
async function render(){
 const page=await pdfDoc.getPage(pageNum);
 const vp=page.getViewport({scale:1.5});
 pdf.width=ink.width=vp.width;pdf.height=ink.height=vp.height;
 pdf.style.width=ink.style.width=vp.width+'px';pdf.style.height=ink.style.height=vp.height+'px';
 wrap.style.width=vp.width+'px';wrap.style.height=vp.height+'px';
 await page.render({canvasContext:pctx,viewport:vp}).promise;
 redraw();pageInfo.textContent=pageNum+'/'+pdfDoc.numPages;
}
function redraw(){
 ictx.clearRect(0,0,ink.width,ink.height);
 for(const s of list()){
  ictx.save();ictx.lineCap='round';ictx.lineJoin='round';
  if(s.tool==='erase'){ictx.globalCompositeOperation='destination-out';ictx.strokeStyle='#000';}
  else if(s.tool==='highlighter'){ictx.globalAlpha=.35;ictx.strokeStyle=colors.high;ictx.globalCompositeOperation='multiply';}
  else{ictx.strokeStyle=colors.pen;}
  ictx.lineWidth=s.w;
  ictx.beginPath();ictx.moveTo(s.p[0].x,s.p[0].y);for(const pt of s.p)ictx.lineTo(pt.x,pt.y);ictx.stroke();ictx.restore();
 }
}
ink.onpointerdown=e=>{
 if(e.pointerType!=='pen'||activeStylusId!==null)return;
 activeStylusId=e.pointerId;
 drawing=true;
 ink.setPointerCapture(e.pointerId);
 current={tool:tool,w:tool==='highlighter'?size.value*3:+size.value,p:[{x:e.offsetX,y:e.offsetY}]};
 list().push(current);
};
ink.onpointermove=e=>{
 if(!drawing||e.pointerId!==activeStylusId)return;
 current.p.push({x:e.offsetX,y:e.offsetY});
 redraw();
};
const stopDrawing=e=>{
 if(e.pointerId!==activeStylusId)return;
 if(e.type==='pointercancel'&&current){
  const currentList=list();
  const idx=currentList.indexOf(current);
  if(idx!==-1)currentList.splice(idx,1);
  redraw();
 }
 drawing=false;
 activeStylusId=null;
 try{ink.releasePointerCapture(e.pointerId);}catch(_){}
};
ink.onpointerup=stopDrawing;
ink.onpointercancel=stopDrawing;
prev.onclick=async()=>{if(pdfDoc&&pageNum>1){pageNum--;await render();}};
next.onclick=async()=>{if(pdfDoc&&pageNum<pdfDoc.numPages){pageNum++;await render();}};
saveBtn.onclick=async()=>{
 if(!pdfDoc)return;
 const doc=await PDFLib.PDFDocument.load(bytes);
 for(let i=1;i<=pdfDoc.numPages;i++){
  const arr=strokes[i];if(!arr||!arr.length)continue;
  const page=doc.getPages()[i-1];const s=page.getSize();
  const c=document.createElement('canvas');c.width=1000;c.height=1000*s.height/s.width;
  const x=c.getContext('2d');x.scale(c.width/pdf.width,c.height/pdf.height);
  const old=pageNum;pageNum=i;
  for(const st of arr){
   x.save();x.lineCap='round';x.lineJoin='round';
   if(st.tool==='erase'){x.globalCompositeOperation='destination-out';x.strokeStyle='#000';}
   else if(st.tool==='highlighter'){x.globalAlpha=.35;x.strokeStyle=colors.high;x.globalCompositeOperation='multiply';}
   else{x.strokeStyle=colors.pen;}
   x.lineWidth=st.w;x.beginPath();x.moveTo(st.p[0].x,st.p[0].y);for(const pt of st.p)x.lineTo(pt.x,pt.y);x.stroke();x.restore();
  }
  pageNum=old;
  const img=await doc.embedPng(await fetch(c.toDataURL()).then(r=>r.arrayBuffer()));
  page.drawImage(img,{x:0,y:0,width:s.width,height:s.height});
 }
 const out=await doc.save();const blob=new Blob([out],{type:'application/pdf'});
 const f=new File([blob],'Notes-Pro-Annotated.pdf',{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:f.name});
 else {const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
