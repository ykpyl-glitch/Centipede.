
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centipede v4</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:system-ui}
header{padding:12px;background:#000;border-bottom:1px solid #333;text-align:center}
#toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#111;border-bottom:1px solid #333}
button{background:#222;color:#fff;border:1px solid #444;padding:8px;border-radius:6px}
button.active{background:#fff;color:#000}
#viewer{height:calc(100vh - 110px);overflow:auto;padding:16px}
.page{position:relative;margin:0 auto 20px;background:#fff;box-shadow:0 0 15px #000;width:max-content}
canvas{display:block}
.draw{position:absolute;left:0;top:0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
<header><b>CENTIPEDE v4</b></header>
<div id="toolbar">
<input type="file" id="pdf" accept="application/pdf">
<button id="pen" class="active">Pen</button>
<button id="high">Highlighter</button>
<button id="erase">Eraser</button>
<button id="undo">Undo</button>
<button id="redo">Redo</button>
<button id="search">Search</button>
<button id="export">Export PDF</button>
<input type="range" id="size" min="1" max="40" value="4">
</div>
<div id="viewer"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let tool='pen',pdfDoc,pdfBytes,currentName='annotated.pdf';
let pageCanvases=[],drawCanvases=[],undo=[],redo=[];
const viewer=document.getElementById('viewer');
function setTool(t){tool=t;['pen','high','erase'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(t==='high'?'high':t).classList.add('active')}
pen.onclick=()=>setTool('pen');high.onclick=()=>setTool('high');erase.onclick=()=>setTool('erase');
pdf.onchange=async e=>{
 const f=e.target.files[0]; if(!f)return; currentName=f.name; pdfBytes=await f.arrayBuffer();
 pdfDoc=await pdfjsLib.getDocument(new Uint8Array(pdfBytes)).promise; viewer.innerHTML='';
 pageCanvases=[];drawCanvases=[];undo=[];redo=[];
 for(let i=1;i<=pdfDoc.numPages;i++){
  const p=await pdfDoc.getPage(i); const vp=p.getViewport({scale:1.5});
  const wrap=document.createElement('div');wrap.className='page';
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  const d=document.createElement('canvas');d.className='draw';d.width=vp.width;d.height=vp.height;
  wrap.append(c,d);viewer.append(wrap);pageCanvases.push(c);drawCanvases.push(d);undo.push([]);redo.push([]);
  await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;setupDraw(d,i-1);
 }
};
function setupDraw(c,idx){
 const ctx=c.getContext('2d');let down=false,last;
 function style(){ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';ctx.globalAlpha=tool==='high'?0.25:1;ctx.strokeStyle=tool==='high'?'#ffe84d':'#000';ctx.lineWidth=(+size.value)*(tool==='high'?3:tool==='erase'?3:1);ctx.lineCap='round';ctx.lineJoin='round';}
 c.onpointerdown=e=>{down=true;last=[e.offsetX,e.offsetY];style();ctx.beginPath();ctx.moveTo(...last);}
 c.onpointermove=e=>{if(!down)return;style();const mx=(last[0]+e.offsetX)/2,my=(last[1]+e.offsetY)/2;ctx.quadraticCurveTo(last[0],last[1],mx,my);ctx.stroke();last=[e.offsetX,e.offsetY];}
 c.onpointerup=()=>{if(!down)return;down=false;undo[idx].push(c.toDataURL());redo[idx]=[];}
 c.onpointerleave=()=>down=false;
}
undo.onclick=()=>{const vis=[...viewer.children];const i=Math.max(0,Math.round(viewer.scrollTop/(vis[0]?.offsetHeight||1)));if(undo[i]?.length>1){redo[i].push(undo[i].pop());restore(drawCanvases[i],undo[i][undo[i].length-1]);}};
redo.onclick=()=>{const vis=[...viewer.children];const i=Math.max(0,Math.round(viewer.scrollTop/(vis[0]?.offsetHeight||1)));if(redo[i]?.length){const s=redo[i].pop();undo[i].push(s);restore(drawCanvases[i],s);}};
function restore(c,data){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(!data)return;const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=data;}
search.onclick=async()=>{if(!pdfDoc)return;const t=prompt('Search');if(!t)return;let m=[];for(let i=1;i<=pdfDoc.numPages;i++){const txt=(await (await pdfDoc.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ');if(txt.toLowerCase().includes(t.toLowerCase()))m.push(i);}alert(m.length?'Pages: '+m.join(', '):'No matches');};
export.onclick=async()=>{if(!pdfBytes)return;const doc=await PDFLib.PDFDocument.load(pdfBytes);const pages=doc.getPages();for(let i=0;i<pages.length;i++){const data=drawCanvases[i].toDataURL();if(data.length<100)continue;const png=await doc.embedPng(data);const s=pages[i].getSize();pages[i].drawImage(png,{x:0,y:0,width:s.width,height:s.height});}const bytes=await doc.save();const file=new File([bytes],currentName,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:currentName});}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=currentName;a.click();}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
