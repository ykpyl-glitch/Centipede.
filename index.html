<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CENTIPEDE.</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

    :root {
      --logo-red: #ff0033;
      --accent: #e8e8ec;
      --accent-dim: #3a3a42;
      --border: #2c2c33;
      --panel: #141417;
      --panel-alt: #1c1c21;
      --text-bright: #ffffff;
      --text-dim: #9a9aa2;
      --disabled-grey: #444449;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none; 
    }

    html, body {
      background-color: #050505;
      color: var(--text-bright);
      font-family: 'Share Tech Mono', monospace;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    body { display: flex; flex-direction: column; }

    header, .viewer-toolbar {
      background: rgba(10, 10, 12, 0.75); 
      backdrop-filter: blur(16px);        
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
      padding: 10px 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
      z-index: 50; 
    }

    header { justify-content: center; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--logo-red);
    }

    .brand svg { width: 26px; height: 26px; }

    main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: scale(0.98) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    .view {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .view.active { 
      display: flex; 
      animation: viewFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }

    #view-menu { padding: 20px; overflow-y: auto; }

    .menu-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--text-bright);
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .menu-actions { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    
    .folder-tree { display: flex; flex-direction: column; gap: 6px; max-width: 700px; }
    
    .folder-item { 
      background: transparent; 
      border: 1px solid transparent; 
      padding: 12px 14px; 
      cursor: pointer; 
      border-radius: 6px;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    .folder-item:hover { background: var(--panel); transform: translateX(4px); }
    .folder-item.active { border-left: 3px solid var(--logo-red); background: var(--panel-alt); transform: translateX(4px); }

    .folder-header { display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 13px; }

    .pdf-list { margin-top: 10px; padding-left: 8px; display: flex; flex-direction: column; gap: 8px; }
    
    .pdf-item {
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.2s ease;
    }
    .pdf-item:hover { background: var(--text-bright); color: #000; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1); }
    .empty-hint { color: var(--text-dim); font-size: 11px; padding: 8px 0; opacity: 0.7; }

    .btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 8px 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      border-radius: 6px; 
      touch-action: manipulation;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover { background: var(--accent-dim); transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }
    .btn.active { background: var(--text-bright); color: #000; border-color: var(--text-bright); font-weight: bold; }
    .btn:disabled { background: var(--panel); border-color: var(--disabled-grey); color: var(--disabled-grey); cursor: not-allowed; opacity: 0.6; }

    #view-viewer { flex-direction: column; }
    .viewer-toolbar { gap: 6px; }

    /* ---------- POPOVER MENUS ---------- */
    .tool-wrapper { position: relative; display: inline-block; }
    
    .tool-popover {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 12px;
      background: rgba(20, 20, 23, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 14px;
      min-width: 220px;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      flex-direction: column;
      gap: 16px;
    }
    
    .tool-popover.active { display: flex; animation: viewFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .popover-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    
    .color-presets { display: flex; gap: 8px; }
    .color-swatch { 
      width: 24px; height: 24px; 
      border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.1); 
      cursor: pointer; 
      transition: transform 0.1s;
    }
    .color-swatch:hover { transform: scale(1.15); border-color: #fff; }
    
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 50%; }
    
    .size-preview-container {
      width: 44px; height: 44px; 
      display: flex; align-items: center; justify-content: center;
      background: #000; border-radius: 6px; border: 1px solid var(--border);
    }
    .size-preview-dot { border-radius: 50%; }

    /* Custom Range Slider */
    input[type=range] { -webkit-appearance: none; background: transparent; flex: 1; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #2c2c33; border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--text-bright); cursor: pointer; -webkit-appearance: none; margin-top: -6px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: transform 0.1s; }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }

    .workspace {
      flex: 1;
      position: relative;
      background: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    #canvas-container {
      position: relative;
      background: #ffffff;
      margin: auto;
      transform-origin: top left;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    canvas, .textLayer { position: absolute; top: 0; left: 0; }
    #pdf-canvas { z-index: 1; touch-action: none; }
    .textLayer { z-index: 2; opacity: 0.5; } 
    
    #draw-canvas { 
      z-index: 3; 
      touch-action: none; 
      cursor: crosshair; 
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      mix-blend-mode: multiply; 
    }

    #canvas-container.mode-draw #draw-canvas { pointer-events: auto; }
    #canvas-container.mode-select #draw-canvas { pointer-events: none; }
    #canvas-container.mode-select .textLayer { pointer-events: auto; user-select: none; -webkit-user-select: none; }
    #canvas-container.mode-select .textLayer span { user-select: text; -webkit-user-select: text; cursor: text; }

    .page-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(20, 20, 23, 0.85);
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(2px);
    }
    .page-arrow:active { background: var(--accent); color: #000; }
    .page-arrow.left { left: 12px; }
    .page-arrow.right { right: 12px; }
    .page-arrow:disabled { opacity: 0.25; cursor: default; }

    .page-pill {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 3px;
      z-index: 10;
    }

    .status-bar {
      background: #000;
      border-top: 1px solid var(--border);
      padding: 5px 12px;
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100">
        <path d="M5,50 Q50,10 95,50 Q50,90 5,50 Z" fill="#ffffff" stroke="#000" stroke-width="4"/>
        <circle cx="50" cy="50" r="22" fill="#000"/>
        <polygon points="50,32 58,40 42,40" fill="#ffffff"/>
        <circle cx="50" cy="50" r="5" fill="#ff0033"/>
      </svg>
      CENTIPEDE.
    </div>
  </header>

  <main>
    <section id="view-menu" class="view active">
      <div class="menu-title">// MAIN MENU</div>
      <div class="menu-actions">
        <button class="btn" onclick="document.getElementById('pdf-input').click()">+ LOAD PDF</button>
        <button class="btn" onclick="createNewFolder()">+ NEW FOLDER</button>
      </div>
      <input type="file" id="pdf-input" accept="application/pdf" hidden>
      <div id="folder-tree" class="folder-tree"></div>
    </section>

    <section id="view-viewer" class="view">
      <div class="viewer-toolbar">
        <button class="btn" onclick="showMenu()">☰ MENU</button>
        
        <!-- Pen Tool -->
        <div class="tool-wrapper">
          <button id="btn-pen" class="btn active" onclick="handleToolClick('pen')">PEN</button>
          <div id="popover-pen" class="tool-popover">
            <div class="popover-row">
              <div class="color-presets">
                <div class="color-swatch" style="background:#000000;" onclick="updateToolSettings('pen', 'color', '#000000')"></div>
                <div class="color-swatch" style="background:#ff0033;" onclick="updateToolSettings('pen', 'color', '#ff0033')"></div>
                <div class="color-swatch" style="background:#2962ff;" onclick="updateToolSettings('pen', 'color', '#2962ff')"></div>
                <div class="color-swatch" style="background:#00c853;" onclick="updateToolSettings('pen', 'color', '#00c853')"></div>
              </div>
              <input type="color" id="pen-color-picker" onchange="updateToolSettings('pen', 'color', this.value)">
            </div>
            <div class="popover-row">
              <input type="range" min="1" max="25" value="3" oninput="updateToolSettings('pen', 'size', this.value)">
              <div class="size-preview-container"><div id="pen-preview-dot" class="size-preview-dot"></div></div>
            </div>
          </div>
        </div>

        <!-- Highlighter Tool -->
        <div class="tool-wrapper">
          <button id="btn-highlighter" class="btn" onclick="handleToolClick('highlighter')">HIGHLIGHT</button>
          <div id="popover-highlighter" class="tool-popover">
            <div class="popover-row">
              <div class="color-presets">
                <div class="color-swatch" style="background:#ffeb3b;" onclick="updateToolSettings('highlighter', 'color', '#ffeb3b')"></div>
                <div class="color-swatch" style="background:#00e676;" onclick="updateToolSettings('highlighter', 'color', '#00e676')"></div>
                <div class="color-swatch" style="background:#00e5ff;" onclick="updateToolSettings('highlighter', 'color', '#00e5ff')"></div>
                <div class="color-swatch" style="background:#f50057;" onclick="updateToolSettings('highlighter', 'color', '#f50057')"></div>
              </div>
              <input type="color" id="hl-color-picker" onchange="updateToolSettings('highlighter', 'color', this.value)">
            </div>
            <div class="popover-row">
              <input type="range" min="4" max="60" value="12" oninput="updateToolSettings('highlighter', 'size', this.value)">
              <div class="size-preview-container" style="background:#fff;"><div id="hl-preview-dot" class="size-preview-dot"></div></div>
            </div>
          </div>
        </div>

        <!-- Eraser Tool -->
        <div class="tool-wrapper">
          <button id="btn-eraser" class="btn" onclick="handleToolClick('eraser')">ERASE</button>
          <div id="popover-eraser" class="tool-popover">
            <div class="popover-row">
              <input type="range" min="4" max="80" value="20" oninput="updateToolSettings('eraser', 'size', this.value)">
              <div class="size-preview-container"><div id="eraser-preview-dot" class="size-preview-dot"></div></div>
            </div>
          </div>
        </div>
        
        <button id="btn-touch-toggle" class="btn" onclick="toggleFingerDrawing()">FINGER: OFF</button>
        <button class="btn" onclick="clearCanvas()">CLEAR</button>
        <button class="btn" onclick="exportFullPdf()">EXPORT</button>

        <!-- Right Side Cluster (Undo, Redo, Mode) -->
        <div style="margin-left: auto; display: flex; gap: 6px;">
          <button class="btn" onclick="undoCanvas()">↩ UNDO</button>
          <button class="btn" onclick="redoCanvas()">REDO ↪</button>
          <button id="btn-mode-toggle" class="btn active" onclick="toggleInteractionMode()">MODE: DRAW</button>
        </div>
      </div>

      <div class="workspace">
        <button class="page-arrow left" id="btn-prev-page" onclick="prevPage()">◀</button>
        
        <div id="canvas-container" class="mode-draw">
          <canvas id="pdf-canvas"></canvas>
          <div id="text-layer" class="textLayer"></div>
          <canvas id="draw-canvas"></canvas>
        </div>
        
        <button class="page-arrow right" id="btn-next-page" onclick="nextPage()">▶</button>
        <div class="page-pill" id="page-info">PAGE: 0 / 0</div>
      </div>
    </section>
  </main>

  <div class="status-bar"><span id="status-text">SYSTEM READY // NO PDF LOADED</span></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Core States
    let currentTool = 'pen'; 
    let isDrawing = false;
    let activePenId = null;
    let strokePoints = []; 
    let allowFingerDrawing = false; 
    let interactionMode = 'draw'; 

    // Tool Settings State
    let toolSettings = {
      pen: { size: 3, color: '#000000' },
      highlighter: { size: 12, color: '#ffeb3b' },
      eraser: { size: 20 }
    };
    
    let activePopover = null;

    // Undo / Redo Stacks
    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 20;

    let folders = []; 
    let currentFolderId = null;
    let pdfDoc = null;
    let currentPageNum = 1;
    let totalPages = 0;
    let currentPdfName = '';
    let currentPdfId = null;
    let pageAnnotations = {};

    const pdfCanvas = document.getElementById('pdf-canvas');
    const pdfCtx = pdfCanvas.getContext('2d', { alpha: false });
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const textLayerDiv = document.getElementById('text-layer');

    const DB_NAME = 'centipede-db';
    const DB_VERSION = 1;
    let dbPromise = null;

    function getDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('pdfMeta')) {
            const s = db.createObjectStore('pdfMeta', { keyPath: 'id' });
            s.createIndex('folderId', 'folderId');
          }
          if (!db.objectStoreNames.contains('pdfData')) db.createObjectStore('pdfData', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('annotations')) db.createObjectStore('annotations', { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    function idbPut(storeName, value) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(value);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }

    function idbGet(storeName, key) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const req = db.transaction(storeName, 'readonly').objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    }

    function idbGetAll(storeName) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    }

    function idbDelete(storeName, key) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }

    function purgeAnnotationsForPdf(pdfId) {
      return getDB().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('annotations', 'readwrite');
        const store = tx.objectStore('annotations');
        const req = store.openCursor(IDBKeyRange.bound(pdfId + '_', pdfId + '_\uffff'));
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            cursor.delete();
            cursor.continue();
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }

    async function initApp() {
      document.getElementById('status-text').innerText = "LOADING LIBRARY...";
      updatePreviews(); // Sync UI tools on load
      
      let dbFolders = await idbGetAll('folders');
      if (!dbFolders.length) {
        const def = { id: 'default', name: 'ROOT_DOCS' };
        await idbPut('folders', def);
        dbFolders = [def];
      }
      const dbPdfMeta = await idbGetAll('pdfMeta');
      folders = dbFolders.map(f => ({
        ...f,
        pdfs: dbPdfMeta.filter(p => p.folderId === f.id).map(p => ({ id: p.id, name: p.name }))
      }));
      currentFolderId = folders[0].id;
      renderFolders();
      document.getElementById('status-text').innerText = "SYSTEM READY // LIBRARY LOADED";
    }

    // --- UI MANAGER ---
    function showMenu() {
      closePopovers();
      await saveCurrentPageAnnotation();
      document.getElementById('view-viewer').classList.remove('active');
      document.getElementById('view-menu').classList.add('active');
      renderFolders();
    }
    
    function showViewer() {
      document.getElementById('view-menu').classList.remove('active');
      document.getElementById('view-viewer').classList.add('active');
    }

    function toggleInteractionMode() {
      closePopovers();
      const container = document.getElementById('canvas-container');
      const btn = document.getElementById('btn-mode-toggle');
      
      if (interactionMode === 'draw') {
        interactionMode = 'select';
        btn.innerText = 'MODE: SELECT';
        btn.classList.remove('active');
        container.classList.remove('mode-draw');
        container.classList.add('mode-select');
      } else {
        interactionMode = 'draw';
        btn.innerText = 'MODE: DRAW';
        btn.classList.add('active');
        container.classList.remove('mode-select');
        container.classList.add('mode-draw');
      }
    }

    function handleToolClick(toolName) {
      if (currentTool === toolName) {
        const popover = document.getElementById('popover-' + toolName);
        if (activePopover === popover) {
          closePopovers();
        } else {
          closePopovers();
          popover.classList.add('active');
          activePopover = popover;
        }
      } else {
        setTool(toolName);
        closePopovers();
      }
    }

    function setTool(toolName) {
      currentTool = toolName;
      document.getElementById('btn-pen').classList.toggle('active', toolName === 'pen');
      document.getElementById('btn-highlighter').classList.toggle('active', toolName === 'highlighter');
      document.getElementById('btn-eraser').classList.toggle('active', toolName === 'eraser');
      
      if (interactionMode === 'select') {
         toggleInteractionMode();
      }
    }

    function closePopovers() {
      if (activePopover) {
        activePopover.classList.remove('active');
        activePopover = null;
      }
    }

    function updateToolSettings(tool, prop, value) {
      toolSettings[tool][prop] = value;
      
      if (prop === 'color') {
        if (tool === 'pen') document.getElementById('pen-color-picker').value = value;
        if (tool === 'highlighter') document.getElementById('hl-color-picker').value = value;
      }
      updatePreviews();
    }

    function updatePreviews() {
      const penDot = document.getElementById('pen-preview-dot');
      penDot.style.width = toolSettings.pen.size + 'px';
      penDot.style.height = toolSettings.pen.size + 'px';
      penDot.style.backgroundColor = toolSettings.pen.color;

      const hlDot = document.getElementById('hl-preview-dot');
      hlDot.style.width = toolSettings.highlighter.size + 'px';
      hlDot.style.height = toolSettings.highlighter.size + 'px';
      hlDot.style.backgroundColor = toolSettings.highlighter.color;
      hlDot.style.opacity = 0.4; 

      const erDot = document.getElementById('eraser-preview-dot');
      erDot.style.width = toolSettings.eraser.size + 'px';
      erDot.style.height = toolSettings.eraser.size + 'px';
      erDot.style.backgroundColor = '#ffffff'; 
    }

    function toggleFingerDrawing() {
      allowFingerDrawing = !allowFingerDrawing;
      const btn = document.getElementById('btn-touch-toggle');
      if (allowFingerDrawing) {
        btn.innerText = 'FINGER: ON';
        btn.classList.add('active');
      } else {
        btn.innerText = 'FINGER: OFF';
        btn.classList.remove('active');
      }
    }

    function initCanvasSize(w, h, scale) {
      const container = document.getElementById('canvas-container');
      const dpr = window.devicePixelRatio || 1;

      container.style.width = w + 'px';
      container.style.height = h + 'px';

      textLayerDiv.style.width = w + 'px';
      textLayerDiv.style.height = h + 'px';
      textLayerDiv.style.setProperty('--scale-factor', scale);

      pdfCanvas.width = w * dpr;
      pdfCanvas.height = h * dpr;
      pdfCanvas.style.width = w + 'px';
      pdfCanvas.style.height = h + 'px';

      drawCanvas.width = w * dpr;
      drawCanvas.height = h * dpr;
      drawCanvas.style.width = w + 'px';
      drawCanvas.style.height = h + 'px';

      drawCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawCtx.scale(dpr, dpr);
    }

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    // --- UNDO / REDO ENGINE ---
    function pushStateToHistory() {
      if (undoStack.length >= MAX_HISTORY) undoStack.shift();
      undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
      redoStack = []; 
    }

    function undoCanvas() {
      closePopovers();
      if (undoStack.length === 0) return;
      redoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
      const state = undoStack.pop();
      drawCtx.putImageData(state, 0, 0);
      saveCurrentPageAnnotation();
    }

    function redoCanvas() {
      closePopovers();
      if (redoStack.length === 0) return;
      undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
      const state = redoStack.pop();
      drawCtx.putImageData(state, 0, 0);
      saveCurrentPageAnnotation();
    }

    function clearCanvas() {
      closePopovers();
      pushStateToHistory(); 
      const dpr = window.devicePixelRatio || 1;
      drawCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
      saveCurrentPageAnnotation();
    }

    // --- DRAWING ENGINE ---
    function applyStrokeStyle() {
      if (currentTool === 'eraser') {
        drawCtx.globalAlpha = 1;
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.strokeStyle = '#000'; 
        drawCtx.fillStyle = '#000';
        drawCtx.lineWidth = toolSettings.eraser.size;
      } else if (currentTool === 'highlighter') {
        drawCtx.globalAlpha = 1; // Handled natively by Multiply Blend Mode
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = toolSettings.highlighter.color; 
        drawCtx.fillStyle = toolSettings.highlighter.color;
        drawCtx.lineWidth = toolSettings.highlighter.size;
      } else {
        drawCtx.globalAlpha = 1;
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = toolSettings.pen.color;
        drawCtx.fillStyle = toolSettings.pen.color;
        drawCtx.lineWidth = toolSettings.pen.size;
      }
      
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
    }

    function drawPoint(p) {
      applyStrokeStyle();
      drawCtx.beginPath();
      
      let radius = 1;
      if (currentTool === 'eraser') radius = toolSettings.eraser.size / 2;
      else if (currentTool === 'highlighter') radius = toolSettings.highlighter.size / 2;
      else radius = toolSettings.pen.size / 2;
      
      drawCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      drawCtx.fill();
    }

    function shouldAcceptPointer(e) {
      if (interactionMode !== 'draw') return false; 
      if (e.pointerType === 'pen') return true;
      if (allowFingerDrawing && e.pointerType === 'touch' && e.isPrimary) return true;
      return false;
    }

    function startDrawing(e) {
      closePopovers();
      e.preventDefault();
      e.stopPropagation();

      if (!shouldAcceptPointer(e)) return;
      
      if (activePenId !== null && activePenId !== e.pointerId) {
        isDrawing = false;
        try { drawCanvas.releasePointerCapture(activePenId); } catch (err) {}
      }
      
      activePenId = e.pointerId;
      isDrawing = true;
      
      pushStateToHistory(); 

      const startPt = getPos(e);
      strokePoints = [startPt]; 
      
      try { drawCanvas.setPointerCapture(activePenId); } catch (err) {}
      
      drawPoint(startPt);
    }

    function draw(e) {
      e.preventDefault();
      e.stopPropagation();
      
      if (!isDrawing || e.pointerId !== activePenId) return;
      
      const events = (typeof e.getCoalescedEvents === 'function') 
        ? e.getCoalescedEvents() 
        : [e];

      for (let i = 0; i < events.length; i++) {
        const pt = getPos(events[i]);
        strokePoints.push(pt);
        
        applyStrokeStyle();
        if (strokePoints.length >= 3) {
          const p0 = strokePoints[strokePoints.length - 3];
          const p1 = strokePoints[strokePoints.length - 2];
          const p2 = strokePoints[strokePoints.length - 1];
          
          const mid1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
          const mid2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
          
          drawCtx.beginPath();
          drawCtx.moveTo(mid1.x, mid1.y);
          drawCtx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
          drawCtx.stroke();
        } else if (strokePoints.length === 2) {
          drawCtx.beginPath();
          drawCtx.moveTo(strokePoints[0].x, strokePoints[0].y);
          drawCtx.lineTo(strokePoints[1].x, strokePoints[1].y);
          drawCtx.stroke();
        }
      }
    }

    function stopDrawing(e) {
      if (e.pointerId !== activePenId) return;
      e.preventDefault();
      e.stopPropagation();

      isDrawing = false;
      activePenId = null;
      strokePoints = [];
    }

    function cancelDrawing(e) {
      if (e.pointerId !== activePenId) return;
      e.preventDefault();
      e.stopPropagation();

      isDrawing = false;
      activePenId = null;
      strokePoints = [];
    }

    drawCanvas.addEventListener('pointerdown', startDrawing, { passive: false });
    drawCanvas.addEventListener('pointermove', draw, { passive: false });
    drawCanvas.addEventListener('pointerup', stopDrawing, { passive: false });
    drawCanvas.addEventListener('pointercancel', cancelDrawing, { passive: false });
    drawCanvas.addEventListener('pointerleave', stopDrawing, { passive: false });
    drawCanvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && currentPdfId) {
        saveCurrentPageAnnotation();
      }
    });

    async function createNewFolder() {
      const name = prompt("ENTER FOLDER NAME:");
      if (!name) return;
      const folder = { id: 'folder_' + Date.now(), name: name.toUpperCase() };
      await idbPut('folders', folder);
      folders.push({ ...folder, pdfs: [] });
      renderFolders();
    }

    async function deleteFolder(folderId, evt) {
      evt.stopPropagation();
      const folder = folders.find(f => f.id === folderId);
      if (!folder) return;
      if (!confirm(`Delete folder "${folder.name}" and all ${folder.pdfs.length} PDF(s) inside it? This cannot be undone.`)) return;
      for (const pdf of folder.pdfs) {
        await idbDelete('pdfMeta', pdf.id);
        await idbDelete('pdfData', pdf.id);
        await purgeAnnotationsForPdf(pdf.id);
      }
      await idbDelete('folders', folderId);
      folders = folders.filter(f => f.id !== folderId);
      if (!folders.length) {
        const def = { id: 'default', name: 'ROOT_DOCS' };
        await idbPut('folders', def);
        folders = [{ ...def, pdfs: [] }];
      }
      if (currentFolderId === folderId) currentFolderId = folders[0].id;
      renderFolders();
    }

    async function deletePdf(folderId, pdfId, evt) {
      evt.stopPropagation();
      if (!confirm('Delete this PDF and its markup? This cannot be undone.')) return;
      await idbDelete('pdfMeta', pdfId);
      await idbDelete('pdfData', pdfId);
      await purgeAnnotationsForPdf(pdfId);
      const folder = folders.find(f => f.id === folderId);
      if (folder) folder.pdfs = folder.pdfs.filter(p => p.id !== pdfId);
      renderFolders();
    }

    function renderFolders() {
      const tree = document.getElementById('folder-tree');
      tree.innerHTML = '';

      folders.forEach((f, index) => {
        const fEl = document.createElement('div');
        fEl.className = 'folder-item' + (f.id === currentFolderId ? ' active' : '');
        fEl.style.opacity = '0'; 
        fEl.style.animation = `viewFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.05}s`;
        
        fEl.onclick = () => { currentFolderId = f.id; renderFolders(); };
        fEl.innerHTML = `
          <div class="folder-header">
            <span>📁 ${f.name}</span>
            <span style="display:flex;align-items:center;gap:8px;">
              (${f.pdfs.length})
              <button class="btn" style="padding:4px 8px;font-size:10px;" onclick="deleteFolder('${f.id}', event)">×</button>
            </span>
          </div>
          <div class="pdf-list">
            ${f.pdfs.length ? f.pdfs.map(pdf => `
              <div class="pdf-item" onclick="event.stopPropagation(); openPdfFromMemory('${pdf.id}')">
                <span>📄 ${pdf.name}</span>
                <button class="btn" style="padding:4px 8px;font-size:10px;" onclick="deletePdf('${f.id}','${pdf.id}', event)">×</button>
              </div>
            `).join('') : '<div class="empty-hint">No PDFs yet — tap + LOAD PDF above.</div>'}
          </div>
        `;
        tree.appendChild(fEl);
      });
    }

    document.getElementById('pdf-input').addEventListener('change', async function (e) {
      try {
        document.getElementById('status-text').innerText = "IMPORTING PDF...";
        const file = e.target.files[0];
        if (!file) return;
        
        const arrayBuffer = await file.arrayBuffer();
        const safeData = new Uint8Array(arrayBuffer);
        
        const id = 'pdf_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const meta = { id, folderId: currentFolderId, name: file.name };
        
        await idbPut('pdfMeta', meta);
        await idbPut('pdfData', { id, data: safeData });
        
        const folder = folders.find(f => f.id === currentFolderId) || folders[0];
        folder.pdfs.push({ id, name: file.name });
        
        renderFolders(); 
        
        openPdf(safeData, file.name, id);
        e.target.value = '';
      } catch (err) {
        console.error(err);
        alert("Error loading file: " + err.message);
        document.getElementById('status-text').innerText = "IMPORT FAILED";
      }
    });

    async function openPdfFromMemory(pdfId) {
      const record = await idbGet('pdfData', pdfId);
      if (!record) { alert('Could not load that PDF from storage.'); return; }
      const meta = await idbGet('pdfMeta', pdfId);
      openPdf(new Uint8Array(record.data), meta ? meta.name : 'Untitled.pdf', pdfId);
    }

    function openPdf(typedarray, name, pdfId) {
      showViewer();
      currentPdfId = pdfId;
      document.getElementById('status-text').innerText = "LOADING: " + name;
      pdfjsLib.getDocument(typedarray).promise.then(pdf => {
        pdfDoc = pdf;
        totalPages = pdf.numPages;
        currentPdfName = name;
        currentPageNum = 1;
        pageAnnotations = {};
        renderPage(1, true); 
      }).catch(err => {
        document.getElementById('status-text').innerText = "ERROR LOADING PDF";
        console.error(err);
      });
    }

    function saveCurrentPageAnnotation() {
      if (!pdfDoc || !currentPdfId) return Promise.resolve();
      const pageToSave = currentPageNum;
      
      return new Promise(resolve => {
        drawCanvas.toBlob(async (blob) => {
          if (!blob) {
            resolve();
            return;
          }
          pageAnnotations[pageToSave] = blob;
          await idbPut('annotations', { 
            key: currentPdfId + '_' + pageToSave, 
            data: blob 
          });
          resolve();
        }, 'image/png');
      });
    }

    async function renderPage(num, isInitialLoad = false) {
      if (!pdfDoc || num < 1 || num > totalPages) return;
      
      if (!isInitialLoad) {
        await saveCurrentPageAnnotation();
      }

      undoStack = [];
      redoStack = [];

      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });
      const dpr = window.devicePixelRatio || 1;
      
      initCanvasSize(viewport.width, viewport.height, viewport.scale);

      const renderContext = {
        canvasContext: pdfCtx,
        viewport: viewport,
        transform: [dpr, 0, 0, dpr, 0, 0]
      };
      
      await page.render(renderContext).promise;

      textLayerDiv.innerHTML = '';
      const textContent = await page.getTextContent();
      await pdfjsLib.renderTextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport: viewport,
        textDivs: []
      }).promise;

      currentPageNum = num;
      drawCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);

      let saved = pageAnnotations[num];
      if (saved === undefined) {
        const rec = await idbGet('annotations', currentPdfId + '_' + num);
        
        if (rec && rec.data) {
          saved = rec.data; 
        } else if (rec && rec.dataUrl) {
          saved = rec.dataUrl;
        } else {
          saved = null;
        }
        pageAnnotations[num] = saved;
      }
      
      if (saved) {
        const img = new Image();
        const isBlob = saved instanceof Blob;
        const objectUrl = isBlob ? URL.createObjectURL(saved) : saved;
        
        img.onload = () => {
           const oldOp = drawCtx.globalCompositeOperation;
           const oldAlpha = drawCtx.globalAlpha;
           
           drawCtx.globalCompositeOperation = 'source-over';
           drawCtx.drawImage(img, 0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
           drawCtx.globalCompositeOperation = oldOp;
           drawCtx.globalAlpha = oldAlpha;
           
           if (isBlob) URL.revokeObjectURL(objectUrl); 
        };
        img.src = objectUrl;
      }
      
      updatePageControls();
      document.getElementById('status-text').innerText = "READY // " + currentPdfName;
    }

    function nextPage() { if (pdfDoc && currentPageNum < totalPages) renderPage(currentPageNum + 1, false); }
    function prevPage() { if (pdfDoc && currentPageNum > 1) renderPage(currentPageNum - 1, false); }

    function updatePageControls() {
      document.getElementById('page-info').innerText = `PAGE: ${currentPageNum} / ${totalPages}`;
      document.getElementById('btn-prev-page').disabled = currentPageNum <= 1;
      document.getElementById('btn-next-page').disabled = currentPageNum >= totalPages;
    }

    async function exportFullPdf() {
      closePopovers();
      try {
        if (!currentPdfId) return;
        
        document.getElementById('status-text').innerText = "EXPORTING FULL PDF... PLEASE WAIT";
        await saveCurrentPageAnnotation();
        const record = await idbGet('pdfData', currentPdfId);
        if (!record || !record.data) throw new Error("Could not load original PDF data.");
        
        const { PDFDocument, BlendMode } = PDFLib;
        const pdf = await PDFDocument.load(record.data);
        const pages = pdf.getPages();
        
        for (let i = 0; i < pages.length; i++) {
          const pageNum = i + 1;
          let annotationData = pageAnnotations[pageNum];
          if (annotationData === undefined) {
             const rec = await idbGet('annotations', currentPdfId + '_' + pageNum);
             if (rec && rec.data) annotationData = rec.data;
             else if (rec && rec.dataUrl) annotationData = rec.dataUrl;
          }
          if (annotationData) {
            let pngImageBytes;
            if (annotationData instanceof Blob) {
              pngImageBytes = await annotationData.arrayBuffer();
            } else if (typeof annotationData === 'string' && annotationData.startsWith('data:image/png;base64,')) {
               const b64 = annotationData.split(',')[1];
               const binStr = atob(b64);
               const arr = new Uint8Array(binStr.length);
               for (let k = 0; k < binStr.length; k++) arr[k] = binStr.charCodeAt(k);
               pngImageBytes = arr.buffer;
            }
            
            if (pngImageBytes) {
               const pngImage = await pdf.embedPng(pngImageBytes);
               const page = pages[i];
               const { width, height } = page.getSize();
               
               page.drawImage(pngImage, {
                 x: 0,
                 y: 0,
                 width: width,
                 height: height,
                 blendMode: BlendMode.Multiply
               });
            }
          }
        }
        
        const pdfBytes = await pdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const fileName = (currentPdfName.replace('.pdf', '') || 'Document') + '_Annotated.pdf';
        const file = new File([blob], fileName, { type: 'application/pdf' });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: fileName });
          document.getElementById('status-text').innerText = "EXPORTED // " + fileName;
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
          document.getElementById('status-text').innerText = "EXPORTED // " + fileName;
        }
      } catch (err) {
        console.error('Export failed:', err);
        document.getElementById('status-text').innerText = "EXPORT FAILED";
        alert('Export failed: ' + err.message);
      }
    }
    
    updatePageControls();
    initApp();
  </script>
</body>
</html>
