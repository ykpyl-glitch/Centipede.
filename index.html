<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6f5e">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>
<style>
body{margin:0;font-family:-apple-system;background:#111;color:white;display:flex;flex-direction:column;height:100vh}
header{padding:12px;background:#1c211f;display:flex;gap:8px;align-items:center}
button{background:#2f6f5e;color:white;border:0;border-radius:10px;padding:10px 14px}
#stage{flex:1;overflow:auto;background:#555;display:flex;justify-content:center}
#wrap{position:relative;margin:16px}
canvas{position:absolute;left:0;top:0}
#pdf{position:relative}
</style>
</head>
<body>
<header>
<button id="open">Open PDF</button>
<button id="save">Save</button>
<input id="file" type="file" accept="application/pdf" hidden>
</header>
<div id="stage"><div id="wrap"><canvas id="pdf"></canvas><canvas id="ink"></canvas></div></div>
<script>
const file=document.getElementById('file');
const open=document.getElementById('open');
const save=document.getElementById('save');
const pdfCanvas=document.getElementById('pdf');
const ink=document.getElementById('ink');
const pctx=pdfCanvas.getContext('2d');
const ictx=ink.getContext('2d');
let pdfDoc,bytes,strokes=[],drawing=false,current=[];

open.onclick=()=>file.click();

file.onchange=async()=>{
 const f=file.files[0];
 if(!f)return;
 bytes=await f.arrayBuffer();
 pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise;
 const page=await pdfDoc.getPage(1);
 const vp=page.getViewport({scale:1.4});
 pdfCanvas.width=ink.width=vp.width;
 pdfCanvas.height=ink.height=vp.height;
 pdfCanvas.style.width=ink.style.width=vp.width+"px";
 pdfCanvas.style.height=ink.style.height=vp.height+"px";
 document.getElementById('wrap').style.width=vp.width+"px";
 document.getElementById('wrap').style.height=vp.height+"px";
 await page.render({canvasContext:pctx,viewport:vp}).promise;
 redraw();
};

function redraw(){
 ictx.clearRect(0,0,ink.width,ink.height);
 ictx.lineCap='round';
 ictx.lineJoin='round';
 ictx.strokeStyle='#000';
 ictx.lineWidth=3;
 for(const s of strokes){
   ictx.beginPath();
   ictx.moveTo(s[0].x,s[0].y);
   for(const p of s)ictx.lineTo(p.x,p.y);
   ictx.stroke();
 }
}

ink.onpointerdown=e=>{if(e.pointerType!=='pen')return;drawing=true;current=[{x:e.offsetX,y:e.offsetY}]};
ink.onpointermove=e=>{if(!drawing)return;current.push({x:e.offsetX,y:e.offsetY});strokes=[...strokes.filter(s=>s!==current),current];redraw()};
ink.onpointerup=()=>{if(drawing){drawing=false;strokes.push(current)}};

save.onclick=async()=>{
 if(!pdfDoc)return;
 const doc=await PDFLib.PDFDocument.load(bytes);
 const page=doc.getPages()[0];
 const c=document.createElement('canvas');
 c.width=ink.width*2;c.height=ink.height*2;
 const ctx=c.getContext('2d');
 ctx.scale(2,2);
 ctx.drawImage(ink,0,0);
 const img=await doc.embedPng(await fetch(c.toDataURL()).then(r=>r.arrayBuffer()));
 const s=page.getSize();
 page.drawImage(img,{x:0,y:0,width:s.width,height:s.height});
 const out=await doc.save();
 const blob=new Blob([out],{type:'application/pdf'});
 const f=new File([blob],'annotated.pdf',{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))
   await navigator.share({files:[f],title:f.name});
 else alert("Use Safari on iPad.");
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
